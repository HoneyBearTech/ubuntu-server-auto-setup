[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = false
host_key_checking = true
forks = 10
# Seconds to wait for an SSH connection and for sudo's password prompt. Ansible's 10 was too short right
# after a server rebooted or restarted a service, when the prompt can take a while to appear.
timeout = 30

[ssh_connection]
pipelining = true
