---
version: 2
# Updates wait for the maintainer: a new Ansible or collection version can change what the playbooks do to
# real servers, so each one is merged only after the required checks pass and, for runtime packages, a run
# against a disposable VM. Ansible collections (requirements.yml) have no Dependabot ecosystem; they are
# checked by hand as described in docs/dependencies.md.
updates:
  # Control-node packages (requirements.txt) and the lint tools (requirements-dev.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version: analyze refuses a configuration written by a
      # different init.
      codeql-action:
        patterns: ["github/codeql-action*"]
