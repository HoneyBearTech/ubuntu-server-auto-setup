---
version: 2
# Patch and minor updates are approved and merged automatically once every required check passes,
# including the integration tests (.github/workflows/dependabot-auto-merge.yml); major updates and image
# digest updates wait for the maintainer. Ansible collections (requirements.yml) have no Dependabot
# ecosystem; they are checked by hand as described in docs/dependencies.md.
updates:
  # Control-node packages (requirements.txt), the web UI's (requirements-webui.in, hash-pinned in
  # requirements-webui.txt for the image) and the lint and test tools (requirements-dev.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version: analyze refuses a configuration written by a
      # different init.
      codeql-action:
        patterns: ["github/codeql-action*"]

  # Base images of the web UI image (Dockerfile) and of the integration-test containers, pinned by digest.
  - package-ecosystem: "docker"
    directories: ["/", "/tests/images/pve-node", "/tests/images/ubuntu-target"]
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
