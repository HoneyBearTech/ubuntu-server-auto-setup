---
version: 2
# Patch and minor updates are approved and merged automatically once every required check passes,
# including the integration tests (.github/workflows/dependabot-auto-merge.yml); major updates and all
# Docker base-image updates wait for the maintainer. Ansible collections (requirements.yml) have no Dependabot
# ecosystem; they are checked by hand as described in docs/dependencies.md.
updates:
  # Control-node packages (requirements.txt), the web UI's (requirements-webui.in, hash-pinned in
  # requirements-webui.txt for the image) and the lint and test tools (requirements-dev.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  # The web UI's app (webui/frontend/package.json, locked with integrity hashes in package-lock.json).
  # Development tools are grouped so a routine update is one pull request.
  - package-ecosystem: "npm"
    directory: "/webui/frontend"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # react and react-dom must always have the exact same version (React refuses to run otherwise), and the
      # type packages follow them, so they move together. Listed before frontend-dev, which would otherwise
      # take the type packages: Dependabot uses the first group that matches.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      frontend-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version: analyze refuses a configuration written by a
      # different init.
      codeql-action:
        patterns: ["github/codeql-action*"]

  # Base images of the web UI image (Dockerfile) and of the integration-test containers, pinned by digest.
  - package-ecosystem: "docker"
    directories: ["/", "/tests/images/pve-node", "/tests/images/ubuntu-target"]
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    ignore:
      # The image runs ansible-core 2.20, which supports Python 3.12 to 3.14 on the control node. Move the
      # image past 3.14 together with an ansible-core that supports the newer Python (and only once every
      # package in requirements-webui.txt ships wheels for it).
      - dependency-name: "python"
        versions: [">=3.15"]
      # The front-end build stage follows Node.js long-term-support releases (even numbers). Odd releases are
      # never LTS and reach end of life within months (25 did in June 2026).
      - dependency-name: "node"
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30"]
