---
name: CodeQL

# CodeQL has no analysis for YAML or Ansible, so it analyses the GitHub Actions workflows themselves
# (injection of untrusted event data, excessive permissions, unpinned actions) and the Python helpers of the
# integration tests. The playbooks are covered by ansible-lint in checks.yml.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # actions: the workflows. python: the integration-test helpers in tests/ (mock API, coverage).
        language: [actions, python]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
