---
name: Installer ISO

# The integration tests use a small stand-in ISO. This job remasters the real Ubuntu 26.04 live-server ISO
# (about 3 GB) in the test "Proxmox node" container and checks the result: Ubuntu's signature on
# SHA256SUMS (with the key that ships in the role), the checksum from it, the autoinstall kernel argument,
# and BIOS and UEFI boot records identical to the original. Then it installs Ubuntu from that ISO in a VM
# with Secure Boot (OVMF, Microsoft's keys enrolled) and a TPM 2.0, as Proxmox runs the role's VMs, with
# the role's user-data for an encrypted disk, and checks Secure Boot, LUKS2, unlocking with the TPM and the
# recovery passphrase (tests/secure-boot-install.sh).
# Weekly (Ubuntu can publish a new point release or change the ISO layout at any time) and on changes to
# the installer roles or the installer's configuration. The ISO is cached by its SHA-256, so only a new point
# release downloads it again; the role still checks the cached copy against the signed SHA256SUMS, so a bad
# cache entry is re-downloaded.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "23 4 * * 3" # weekly, Wednesday 04:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "roles/installer_iso/**"
      - "roles/ubuntu_release/**"
      - "roles/proxmox_vm/templates/**"
      - "tests/real-iso.sh"
      - "tests/show-failures.sh"
      - "tests/secure-boot-install.sh"
      - "tests/images/pve-node/**"
      - ".github/workflows/installer-iso.yml"

permissions:
  contents: read

jobs:
  real-iso:
    name: Remaster the real Ubuntu ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the control-node packages and collections
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          ansible-galaxy collection install -r requirements.yml

      # The cached ISO, the remastered one, the VM's disk and the container image need more room than the runner
      # has free.
      - name: Free disk space and install QEMU, OVMF and swtpm
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools xorriso
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /

      - name: Find the current live-server ISO
        id: iso
        run: |
          line="$(curl -fsS --retry 3 https://releases.ubuntu.com/26.04/SHA256SUMS \
            | grep -E '^[0-9a-f]{64} \*ubuntu-26\.04(\.[0-9]+)?-live-server-amd64\.iso$' | sort -V -k2 | tail -n 1)"
          sha="${line%% *}"
          name="${line#*\*}"
          [[ "$sha" =~ ^[0-9a-f]{64}$ && "$name" =~ ^ubuntu-26\.04(\.[0-9]+)?-live-server-amd64\.iso$ ]]
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore the cached ISO
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/iso-cache
          key: ubuntu-iso-${{ steps.iso.outputs.sha256 }}

      - name: Download the ISO (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ISO_NAME: ${{ steps.iso.outputs.name }}
          ISO_SHA256: ${{ steps.iso.outputs.sha256 }}
        run: |
          mkdir -p ~/iso-cache
          # Any mirror will do: the checksum below and the role's signed SHA256SUMS decide what's accepted.
          for base in https://mirrors.edge.kernel.org/ubuntu-releases/26.04 https://releases.ubuntu.com/26.04; do
            if curl -fL --retry 3 --speed-limit 1000000 --speed-time 60 -o ~/iso-cache/"$ISO_NAME" "$base/$ISO_NAME" \
              && echo "$ISO_SHA256  $HOME/iso-cache/$ISO_NAME" | sha256sum -c -; then
              exit 0
            fi
            rm -f ~/iso-cache/"$ISO_NAME"
          done
          echo "Couldn't download $ISO_NAME from any mirror" >&2
          exit 1

      - name: Save the ISO to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/iso-cache
          key: ubuntu-iso-${{ steps.iso.outputs.sha256 }}

      - name: Remaster and check the real ISO
        env:
          USAS_ISO_CACHE: ~/iso-cache
          USAS_KEEP_ISO: ${{ runner.temp }}/autoinstall.iso
          USAS_LOG_DIR: ${{ runner.temp }}/real-iso-logs
        run: tests/real-iso.sh

      - name: Keep the remaster's full logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-iso-logs
          path: ${{ runner.temp }}/real-iso-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install from it under Secure Boot with an encrypted disk, and boot unattended
        run: tests/secure-boot-install.sh "$RUNNER_TEMP/autoinstall.iso" "$RUNNER_TEMP/secure-boot"

      - name: Keep the VM's logs and screen dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-boot-install
          path: |
            ${{ runner.temp }}/secure-boot/*.log
            ${{ runner.temp }}/secure-boot/*.ppm
            ${{ runner.temp }}/secure-boot/luksdump.txt
          if-no-files-found: ignore
          retention-days: 14
