---
name: OS catalog

# tools/update_os_catalog.py checks every image the OS catalog pins (roles/os_catalog/vars/catalog.yml) against the
# vendors' indexes again: the signature on the checksum file where the vendor signs it (gpgv, pinned fingerprints),
# the checksum, and that the image can still be downloaded. On a pull request that changes the catalog, the script
# or its keys, a pin that fails fails the check. Weekly, it opens an issue (or updates the open one) when a pin
# fails or a vendor has a newer build, and closes it once the catalog checks out again; the maintainer then runs
# make catalog and opens a pull request. It's an issue rather than a pull request: one opened with this workflow's
# token wouldn't run the other checks, and an app's token would be another secret. tools/update_k3s_catalog.py
# does the same for the k3s catalog (roles/k3s/vars/catalog.yml: k3s' checksums, kube-vip's digests), in the same
# issue.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "41 5 * * 1" # weekly, Monday 05:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "roles/os_catalog/vars/catalog.yml"
      - "tools/update_os_catalog.py"
      - "tools/os-catalog-keys/**"
      - "roles/k3s/vars/catalog.yml"
      - "tools/update_k3s_catalog.py"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check the pinned images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Standard library and gpgv only (the runner has gpgv).
      - name: Check every pinned image against the vendors
        run: python3 tools/update_os_catalog.py --check --report "$RUNNER_TEMP/catalog-report.md"
        # On the weekly run the issue reports a failure; on a pull request it fails the check.
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      # GitHub's API and GHCR only; the token (read-only here) raises the API's rate limit.
      - name: Check the k3s catalog against upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/update_k3s_catalog.py --check --report "$RUNNER_TEMP/k3s-catalog-report.md"
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Keep the report for the issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-report
          path: |
            ${{ runner.temp }}/catalog-report.md
            ${{ runner.temp }}/k3s-catalog-report.md
          if-no-files-found: error
          retention-days: 7

  report:
    name: Open, update or close the refresh issue
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with a write permission; it runs no code from the repository or the vendors.
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-report

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "OS catalog: refresh needed"
        run: |
          # Both catalogs' findings in one issue, a blank line between them; empty if neither found anything.
          : > report.md
          for part in catalog-report.md k3s-catalog-report.md; do
            if [ -s "$part" ]; then
              if [ -s report.md ]; then echo >> report.md; fi
              cat "$part" >> report.md
            fi
          done
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -s report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every pin checks out again, and nothing upstream is newer."
          fi
