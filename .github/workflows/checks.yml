---
name: CI

# Every pull request and push to main: YAML and Ansible lint, a syntax check of every playbook, the workflow
# linter, a secret scan over the whole history, and the integration tests (the playbooks run against
# containers and a mock Proxmox API; see docs/testing.md). The job names are the required status checks in
# the main branch ruleset; keep them stable.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint + syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # Exact versions with hashes (requirements-ci.txt, compiled from requirements.txt and
      # requirements-dev.txt), so CI installs exactly what was reviewed.
      - name: Install the control-node packages and lint tools
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # Coding standards (CONTRIBUTING.md#coding-standards). Any finding fails the build.
      - name: Lint YAML (yamllint)
        run: yamllint --format github .

      - name: Lint Ansible (ansible-lint, production profile)
        run: ansible-lint

      - name: Syntax-check every playbook
        run: ansible-playbook -i inventory/hosts.example.yml --syntax-check playbooks/site.yml

      - name: Lint workflows (actionlint, with shellcheck)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the control-node packages
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # Builds the test images, runs every playbook against them (installer, provisioning through the mock
      # Proxmox API, baseline), checks the results and idempotence, and fails below 80% task coverage.
      - name: Run the integration tests
        run: tests/run.sh

  osv:
    name: Vulnerability scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every requirements file, including the lower bounds in requirements.txt and their transitive
      # dependencies, against the OSV database (the same data OpenSSF Scorecard uses). Any known
      # vulnerability fails the check.
      - name: Known vulnerabilities in the dependency files
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source -r /src

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit

      # The checkout belongs to another user inside the container, so git needs safe.directory, and the step
      # fails if gitleaks ever scans nothing (it would otherwise report "no leaks found").
      - name: No secrets in the repository or its history
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --no-color /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -Eq ' 0 commits scanned|ERR' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks didn't scan the history"
            exit 1
          fi
