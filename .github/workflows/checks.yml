---
name: CI

# Every pull request and push to main: YAML, Ansible, Python and Dockerfile lint, a syntax check of every
# playbook, the workflow linter, a secret scan over the whole history, the integration tests (the playbooks
# run against containers and a mock Proxmox API), the web UI's unit tests (server and app) and browser tests, and a smoke
# test of the container image (see docs/testing.md). The job names are the required status checks in the main branch ruleset; keep
# them stable.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint + syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # Exact versions with hashes (requirements-ci.txt, compiled from requirements.txt and
      # requirements-dev.txt), so CI installs exactly what was reviewed.
      - name: Install the control-node packages and lint tools
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the Ansible collections
        run: scripts/retry.sh ansible-galaxy collection install -r requirements.yml

      # Coding standards (CONTRIBUTING.md#coding-standards). Any finding fails the build.
      - name: Lint YAML (yamllint)
        run: yamllint --format github .

      - name: Lint Ansible (ansible-lint, production profile)
        run: ansible-lint

      - name: Syntax-check every playbook
        run: ansible-playbook -i inventory/hosts.example.yml --syntax-check playbooks/site.yml playbooks/prepare-node.yml

      - name: Lint workflows (actionlint, with shellcheck)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # The web UI's Python and tools/, with the rules in ruff.toml (including bandit's security checks).
      - name: Lint Python (ruff)
        run: ruff check --output-format github

      # tools/update_os_catalog.py, offline: made-up vendor indexes signed with a throwaway key (make catalog-test).
      - name: Unit-test the OS catalog tool
        run: make catalog-test

      # The Docker Hub overview the release publishes: within Docker Hub's size limit, Markdown it renders,
      # absolute URLs only.
      - name: Check the Docker Hub overview
        run: python3 tests/check_dockerhub.py

      - name: Lint the Dockerfile (hadolint)
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < Dockerfile

  playbooks:
    name: Integration tests (playbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the control-node packages
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the Ansible collections
        run: scripts/retry.sh ansible-galaxy collection install -r requirements.yml

      # Builds the test images, runs every playbook against them (installer, provisioning through the mock
      # Proxmox API, baseline), checks the results and idempotence, and fails below 80% task coverage.
      - name: Run the integration tests
        run: tests/run.sh

  updates:
    name: Integration tests (updates, ${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, debian-12, debian-13, centos-stream-9, centos-stream-10,
             rocky-9, rocky-10, alma-9, alma-10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the control-node packages
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the Ansible collections
        run: scripts/retry.sh ansible-galaxy collection install -r requirements.yml

      # Builds the test image for the release with a signed apt or dnf repository of test updates, runs the updates
      # playbook against two of them (check, apply, reboots, health checks, refusals), checks the results and
      # idempotence, and fails below 80% task coverage of the updates role.
      - name: Run the updates tests
        env:
          OS: ${{ matrix.os }}
          USAS_LOG_DIR: ${{ runner.temp }}/updates-logs
        run: tests/updates.sh

      - name: Keep the updates tests' logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/updates-logs/
          if-no-files-found: ignore
          retention-days: 7

  baseline:
    name: Integration tests (baseline, ${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # tests/run.sh covers Ubuntu 26.04; these are the other releases the baseline supports.
        os: [ubuntu-22.04, ubuntu-24.04, debian-12, debian-13, centos-stream-9, centos-stream-10, rocky-9, rocky-10,
             alma-9, alma-10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the control-node packages
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the Ansible collections
        run: scripts/retry.sh ansible-galaxy collection install -r requirements.yml

      # The runner's AppArmor profiles for unix_chkpwd and chronyd are attached by path, so they also confine
      # the test container's copies: unix_chkpwd then can't read /etc/shadow, which the RHEL family's PAM needs
      # to let sshd log in, and chronyd can't tell systemd it has started (the RHEL family's unit runs it in a
      # container, where the time sources tests restart it). The servers themselves have no AppArmor.
      - name: Unload the runner's unix_chkpwd and chronyd AppArmor profiles
        run: |
          for profile in unix-chkpwd /usr/sbin/chronyd; do
            if sudo grep -q "^$profile " /sys/kernel/security/apparmor/profiles; then
              printf %s "$profile" | sudo tee /sys/kernel/security/apparmor/.remove >/dev/null
            fi
          done

      # Builds the stand-in server for the release, runs the baseline against it (check mode, two runs, the
      # result, the reboot check, a move to port 2222) and fails below 80% task coverage of the baseline roles.
      - name: Run the baseline tests
        env:
          OS: ${{ matrix.os }}
        run: tests/baseline.sh

  # The required status check: passes only when every integration suite above passed, so the branch ruleset
  # names one check however the suites are split.
  test:
    name: Integration tests
    if: always()
    needs: [playbooks, updates, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every integration suite passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then echo "An integration suite ended with: $result"; exit 1; fi
          done

  osv:
    name: Vulnerability scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every requirements file, including the lower bounds in requirements.txt and their transitive
      # dependencies, against the OSV database (the same data OpenSSF Scorecard uses). Any known
      # vulnerability fails the check.
      - name: Known vulnerabilities in the dependency files
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source -r /src

      # osv-scanner checks the versions a range resolves to today; this checks the lower bounds themselves
      # (what OpenSSF Scorecard reports, and what pip accepts if an older copy is already installed).
      - name: No lower bound allows a vulnerable version
        run: python3 tests/check_floors.py requirements.txt requirements-dev.txt requirements-webui.in requirements-fuzz.in

  webui:
    name: Web UI tests
    runs-on: ubuntu-latest
    # The browser suite plus Chromium's system packages (from Ubuntu's mirrors, slow at times) can pass 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the packages (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-ci.txt

      # Unit tests of the web UI's server against the real roles and ansible-core; fails below 80% statement
      # coverage (webui/pytest.ini).
      - name: Run the server's unit tests
        working-directory: webui
        run: python -m pytest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      # Exactly the lock file's packages, each checked against its integrity hash; no install scripts
      # (webui/frontend/.npmrc).
      - name: Install the app's packages
        working-directory: webui/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check the app (TypeScript, strict)
        working-directory: webui/frontend
        run: npm run check

      # The app's tests: every page against a fake API, axe-core and structural accessibility checks, WCAG
      # contrast of the colour tokens; fails below 80% statement coverage (vite.config.ts).
      - name: Run the app's tests
        working-directory: webui/frontend
        run: npm test

      - name: Build the app
        working-directory: webui/frontend
        run: npm run build

      # The browser tests start a provisioning run, and the playbook needs the collections.
      - name: Install the Ansible collections
        run: scripts/retry.sh ansible-galaxy collection install -r requirements.yml

      # Chromium, at the build the lock file's Playwright expects: the download is cached by that version; the
      # system libraries it needs come from Ubuntu's archive on every run.
      - name: Find the Playwright version
        id: playwright
        working-directory: webui/frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium for the browser tests
        working-directory: webui/frontend
        run: npx playwright install --with-deps --only-shell chromium

      # The app in Chromium against the server and the mock Proxmox API (tests/webui-browser.sh): setup, the
      # connection test, the node and a run by keyboard only; Tab order, visible focus and no traps on every
      # page; Escape on the phone menu; the run's live status; axe-core's WCAG 2.1 A and AA rules with real
      # layout, so with contrast, in every theme (docs/accessibility.md).
      - name: Run the browser tests (Playwright)
        run: tests/webui-browser.sh

      - name: Keep the browser tests' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: webui/frontend/test-results/
          retention-days: 7

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the image from this checkout, starts it next to the mock Proxmox API (tests/mock_pve.py) and
      # drives the web UI: first-run setup, sign-in, the connection test with the CA, saving every page, and
      # a provisioning run through ansible-playbook that the mock answers.
      - name: Build the image and run the smoke test
        run: tests/webui-smoke.sh

      # The same gate as the release workflow, so a vulnerable base image or package shows up on the pull
      # request rather than when a release is cut.
      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          usas:smoke

      # The Windows start script, with PowerShell 7 on Linux (Windows runners can't run Linux containers):
      # creates the container from the image just built, shows the setup code, starts it again, stops it.
      - name: Start it with start.ps1
        shell: pwsh
        run: |
          $first = ./start.ps1 -Image usas:smoke -NoBrowser -Port 18090 -Name usas-ps -Volume usas-ps-data *>&1 | Out-String
          Write-Output $first
          if ($first -notmatch 'setup code: [A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}') { throw "no setup code" }
          $again = ./start.ps1 -Image usas:smoke -NoBrowser -Port 18090 -Name usas-ps -Volume usas-ps-data *>&1 | Out-String
          if ($again -notmatch 'http://localhost:18090') { throw "second start failed: $again" }
          ./start.ps1 -Name usas-ps -Stop
          docker rm -f usas-ps
          docker volume rm usas-ps-data

  vms:
    name: VMs page integration
    # Pull requests only (VM monitor design, open question 16): it builds the image again and runs the
    # baseline on a systemd container for real.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image, the mock Proxmox API and an Ubuntu 26.04 systemd container standing in for a VM the
      # project didn't create: pin its host key, a check run, the real run after a confirmation, a second
      # check that changes nothing, a guest claiming another VM's address refused, and the audit log.
      - name: Build the image and run the VMs page's runs
        run: tests/webui-vms.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit

      # The checkout belongs to another user inside the container, so git needs safe.directory, and the step
      # fails if gitleaks ever scans nothing (it would otherwise report "no leaks found").
      - name: No secrets in the repository or its history
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --no-color /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -Eq ' 0 commits scanned|ERR' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks didn't scan the history"
            exit 1
          fi
