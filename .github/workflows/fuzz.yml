---
name: Fuzzing

# Atheris fuzz targets (tests/fuzz) for the code that turns inventory values into configuration files and
# shell commands: the installer's user-data, the authorized keys, the ISO checksum and the sshd and
# Fail2Ban settings; and the web UI's status API token header. A minute per target on every pull request
# and push to main, ten minutes weekly. A finding fails the job and its input is uploaded as an artifact.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 0" # weekly, Sunday 05:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-fuzz.txt

      - name: Install Ansible and atheris (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-fuzz.txt

      - name: Run the fuzz targets
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: tests/fuzz/run.sh

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: tests/fuzz/crash-*
          if-no-files-found: ignore
          retention-days: 30
