---
name: Release

# A release: pushing a version tag (vX.Y.Z, signed by the maintainer) runs the CI checks again on the tagged
# commit, then publishes a GitHub Release with:
#   - ubuntu-server-auto-setup-X.Y.Z.tar.gz        the tagged source (git archive, includes LICENSE)
#   - ubuntu-server-auto-setup-X.Y.Z.spdx.json     an SPDX SBOM of the source tree (anchore/sbom-action)
#   - SHA256SUMS                                    checksums of the two files above
#   - SHA256SUMS.sigstore.json                      a cosign keyless signature of SHA256SUMS (Sigstore,
#                                                   identity = this workflow on the tag)
#   - ubuntu-server-auto-setup-X.Y.Z.provenance.sigstore.json and .intoto.jsonl
#                                                   SLSA build provenance for every file in SHA256SUMS
# The release notes are the CHANGELOG.md section for the version. How to verify: docs/verifying-releases.md.
on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    name: Lint + syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release is built from scratch.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the control-node packages, lint tools and collections
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Lint and syntax-check
        run: |
          yamllint --format github .
          ansible-lint
          ansible-playbook -i inventory/hosts.example.yml --syntax-check playbooks/site.yml

  release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS and of the provenance
      attestations: write # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # Describes the tagged source tree: the Python packages declared in requirements*.txt and the
      # GitHub Actions the workflows use.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ubuntu-server-auto-setup-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # After the SBOM, so the SBOM describes the source tree rather than the archive.
      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix="ubuntu-server-auto-setup-${VERSION}/" \
            -o "ubuntu-server-auto-setup-${VERSION}.tar.gz" HEAD

      - name: Checksums
        run: |
          sha256sum "ubuntu-server-auto-setup-${VERSION}.tar.gz" "ubuntu-server-auto-setup-${VERSION}.spdx.json" > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # SLSA build provenance for every file in SHA256SUMS: signed (Sigstore), stored as a GitHub
      # attestation (gh attestation verify) and attached as the full Sigstore bundle.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Provenance files and release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "ubuntu-server-auto-setup-${VERSION}.provenance.sigstore.json"
          # The same provenance as in-toto JSON Lines (one DSSE envelope per line), the format tools such as
          # OpenSSF Scorecard look for in release assets.
          jq -c '.dsseEnvelope' "$BUNDLE" > "ubuntu-server-auto-setup-${VERSION}.intoto.jsonl"
          test -s "ubuntu-server-auto-setup-${VERSION}.intoto.jsonl"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          # Repo-relative links would resolve against the release page; point them at the tag.
          perl -pi -e 's{\]\((?!https?://|#)([^)]+)\)}{](https://github.com/$ENV{REPO}/blob/$ENV{TAG}/$1)}g' notes.md
          verify="https://github.com/${REPO}/blob/${TAG}/docs/verifying-releases.md"
          printf '\n---\nVerify this release: [docs/verifying-releases.md](%s)\n' "$verify" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "ubuntu-server-auto-setup ${TAG}" --notes-file notes.md \
            "ubuntu-server-auto-setup-${VERSION}.tar.gz" "ubuntu-server-auto-setup-${VERSION}.spdx.json" \
            SHA256SUMS SHA256SUMS.sigstore.json \
            "ubuntu-server-auto-setup-${VERSION}.provenance.sigstore.json" \
            "ubuntu-server-auto-setup-${VERSION}.intoto.jsonl"
