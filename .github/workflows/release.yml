---
name: Release

# A release: pushing a version tag (vX.Y.Z, signed by the maintainer) runs the CI checks again on the tagged
# commit, then publishes a GitHub Release with:
#   - ubuntu-server-auto-setup-X.Y.Z.tar.gz        the tagged source (git archive, includes LICENSE)
#   - ubuntu-server-auto-setup-X.Y.Z.spdx.json     an SPDX SBOM of the source tree (anchore/sbom-action)
#   - SHA256SUMS                                    checksums of the two files above
#   - SHA256SUMS.sigstore.json                      a cosign keyless signature of SHA256SUMS (Sigstore,
#                                                   identity = this workflow on the tag)
#   - ubuntu-server-auto-setup-X.Y.Z.provenance.sigstore.json and .intoto.jsonl
#                                                   SLSA build provenance for every file in SHA256SUMS
#   - images.txt                                    the container image's names and digest (also in SHA256SUMS)
# and the container image docker.io/honeybeartech/ubuntu-server-auto-setup:X.Y.Z (and X.Y, latest; the same
# image is mirrored to ghcr.io/honeybeartech/ubuntu-server-auto-setup) for
# linux/amd64 and linux/arm64: scanned with Trivy and smoke-tested first, pushed with an SBOM and SLSA
# provenance (BuildKit attestations), signed keylessly with cosign, and attested to GitHub.
# The release notes are the CHANGELOG.md section for the version, then the exact ansible-core and collection
# versions the checks ran with (scripts/tested-versions.sh). How to verify: docs/verifying-releases.md.
on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    name: Lint + syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release is built from scratch.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the control-node packages, lint tools and collections
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          scripts/retry.sh ansible-galaxy collection install -r requirements.yml

      - name: Lint and syntax-check
        run: |
          yamllint --format github .
          ansible-lint
          ansible-playbook -i inventory/hosts.example.yml --syntax-check playbooks/site.yml playbooks/prepare-node.yml
          ruff check --output-format github

      - name: Web UI unit tests
        working-directory: webui
        run: python -m pytest

      # The exact ansible-core and collection versions this job installed and checked, for the release notes.
      - name: Versions tested
        run: |
          scripts/tested-versions.sh > tested-versions.md
          cat tested-versions.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-versions
          path: tested-versions.md
          retention-days: 1

  image:
    name: Container image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Docker Hub credentials are secrets of the "release" environment, which only v* tags can deploy to:
    # no other workflow, branch or pull request can read them.
    environment:
      name: release
      url: https://hub.docker.com/r/honeybeartech/ubuntu-server-auto-setup
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless signing of the image and its attestation
      attestations: write # store the image's provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lowercase; the owner is "HoneyBearTech". Docker Hub is the main registry, GHCR a mirror.
      - name: Image names
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "dockerhub=docker.io/${owner}/ubuntu-server-auto-setup" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${owner}/ubuntu-server-auto-setup" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.image.outputs.dockerhub }}
            ${{ steps.image.outputs.ghcr }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # No build cache: a release is built from scratch, with this run's security updates (SECURITY_UPDATES).
      - name: Build for the scan and the smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: usas:release-check
          build-args: |
            SECURITY_UPDATES=${{ github.run_id }}
            USAS_VERSION=${{ steps.meta.outputs.version }}

      - name: Scan for fixable HIGH and CRITICAL vulnerabilities (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          usas:release-check

      - name: Smoke test
        env:
          EXPECT_VERSION: ${{ steps.meta.outputs.version }}
        run: tests/webui-smoke.sh usas:release-check

      # One build, pushed to both registries under the same digest.
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            SECURITY_UPDATES=${{ github.run_id }}
            USAS_VERSION=${{ steps.meta.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image in both registries
        env:
          DOCKERHUB: ${{ steps.image.outputs.dockerhub }}
          GHCR: ${{ steps.image.outputs.ghcr }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          : "${DOCKERHUB:?no image name}" "${GHCR:?no image name}" "${DIGEST:?no image digest}"
          : > images.txt
          for image in "$DOCKERHUB" "$GHCR"; do
            cosign sign --yes "${image}@${DIGEST}"
            echo "${image}@${DIGEST}" >> images.txt
          done

      # The same SLSA provenance as a GitHub attestation, for gh attestation verify oci://... (both names).
      - name: Attest the image's build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.dockerhub }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the image's build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.ghcr }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # docs/dockerhub.md as the Docker Hub page (the README uses HTML that Docker Hub doesn't render, and is
      # close to its size limit). Docker Hub's API needs a token
      # with Read, Write, Delete scope for this. A failure here only leaves the old page text, so it doesn't
      # stop the release (the image is already pushed and signed); the job log shows it as a warning.
      - name: Update the Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: honeybeartech/ubuntu-server-auto-setup
          short-description: "USAS: Ubuntu Server on Proxmox VE, installed hands-off and hardened, from a web UI."
          # A shorter overview for Docker Hub, with absolute image and link URLs (tests/check_dockerhub.py):
          # Docker Hub doesn't render <picture> or Mermaid, nor relative URLs inside HTML, and keeps at most
          # 25,000 bytes.
          readme-filepath: ./docs/dockerhub.md
          enable-url-completion: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.txt
          retention-days: 1

  release:
    name: GitHub Release
    needs: [checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS and of the provenance
      attestations: write # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-versions

      # Describes the tagged source tree: the Python packages declared in requirements*.txt and the
      # GitHub Actions the workflows use.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ubuntu-server-auto-setup-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # After the SBOM, so the SBOM describes the source tree rather than the archive.
      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix="ubuntu-server-auto-setup-${VERSION}/" \
            -o "ubuntu-server-auto-setup-${VERSION}.tar.gz" HEAD

      - name: Checksums
        run: |
          sha256sum "ubuntu-server-auto-setup-${VERSION}.tar.gz" "ubuntu-server-auto-setup-${VERSION}.spdx.json" \
            images.txt > SHA256SUMS
          cat images.txt SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # SLSA build provenance for every file in SHA256SUMS: signed (Sigstore), stored as a GitHub
      # attestation (gh attestation verify) and attached as the full Sigstore bundle.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Provenance files and release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "ubuntu-server-auto-setup-${VERSION}.provenance.sigstore.json"
          # The same provenance as in-toto JSON Lines (one DSSE envelope per line), the format tools such as
          # OpenSSF Scorecard look for in release assets.
          jq -c '.dsseEnvelope' "$BUNDLE" > "ubuntu-server-auto-setup-${VERSION}.intoto.jsonl"
          test -s "ubuntu-server-auto-setup-${VERSION}.intoto.jsonl"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          # Repo-relative links would resolve against the release page; point them at the tag.
          perl -pi -e 's{\]\((?!https?://|#)([^)]+)\)}{](https://github.com/$ENV{REPO}/blob/$ENV{TAG}/$1)}g' notes.md
          # The ansible-core and collection versions the checks job installed (scripts/tested-versions.sh).
          test -s tested-versions.md
          printf '\n' >> notes.md
          cat tested-versions.md >> notes.md
          verify="https://github.com/${REPO}/blob/${TAG}/docs/verifying-releases.md"
          printf '\n---\nVerify this release: [docs/verifying-releases.md](%s)\n' "$verify" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "ubuntu-server-auto-setup ${TAG}" --notes-file notes.md \
            "ubuntu-server-auto-setup-${VERSION}.tar.gz" "ubuntu-server-auto-setup-${VERSION}.spdx.json" \
            images.txt SHA256SUMS SHA256SUMS.sigstore.json \
            "ubuntu-server-auto-setup-${VERSION}.provenance.sigstore.json" \
            "ubuntu-server-auto-setup-${VERSION}.intoto.jsonl"
