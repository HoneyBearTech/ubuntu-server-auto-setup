---
# Values the updates playbook accepts, and limits on what servers report. tests/fuzz/ reads them from here, and
# roles/updates/filter_plugins/usas_updates.py uses the same patterns.
updates_scope_values: [all, security]
updates_apt_upgrade_values: [safe, dist]
updates_reboot_values: [never, if_required]
updates_restart_values: [host, list, auto]
# Package names as servers report them: Debian's (and :arch) and RPM's, which may have upper case and _.
updates_package_pattern: '^[A-Za-z0-9][A-Za-z0-9_+.-]{1,127}(:[a-z0-9][a-z0-9-]{0,31})?\Z'
# Shell globs of package names: letters, digits, _ + . - and the wildcards * and ?.
updates_package_glob_pattern: '^[A-Za-z0-9*?][A-Za-z0-9_+.*?-]{0,127}\Z'
# systemd unit names, as in updates_health_services.
updates_service_pattern: '^[A-Za-z0-9][A-Za-z0-9@._:\\-]{0,254}\Z'
# Health URLs: the same form as the notification webhook (fail2ban_webhook_url_pattern).
updates_url_pattern: '^https?://[A-Za-z0-9][A-Za-z0-9.-]{0,252}(:[0-9]{1,5})?(/[A-Za-z0-9._~/+=-]*)?(\?[A-Za-z0-9._~/+=&-]*)?\Z'
# Seconds, for the waits and timeouts.
updates_seconds_pattern: '^[0-9]{1,6}\Z'
# This playbook's snapshots: the name (the time it was taken, UTC) and the start of the description. Only
# snapshots with both are ever deleted.
updates_snapshot_name_pattern: '^usas_upd_([0-9]{8})_([0-9]{6})\Z'
updates_snapshot_marker_pattern: '^USAS updates run [0-9]{8}T[0-9]{6}Z-[0-9a-f]{4};'
# How many snapshots to keep (0 to 10), and their age in days (1 to 365).
updates_snapshot_keep_pattern: '^([0-9]|10)\Z'
updates_snapshot_age_pattern: '^([1-9][0-9]?|[12][0-9]{2}|3[0-5][0-9]|36[0-5])\Z'
# Waves: the largest (1 to 9999 servers, or 1 to 100 %), the per-wave limits (0 to 99, 0 for none), and update
# group names (lower case; updates_group is compared in lower case).
updates_serial_pattern: '^([1-9][0-9]{0,3}|([1-9][0-9]?|100)%)\Z'
updates_parallel_pattern: '^[0-9]{1,2}\Z'
updates_group_pattern: '^[a-z0-9][a-z0-9_.-]{0,62}\Z'
# Kubernetes members: the k3s role's groups (roles/k3s/vars/main.yml), the node's name in Kubernetes (a DNS label),
# and k3s, whose kubectl drains and uncordons them (as root on a server of the cluster).
updates_k8s_group_pattern: '^k8s_([a-z][a-z0-9-]{0,30})_(servers|agents)\Z'
updates_k8s_node_name_pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\Z'
updates_k8s_binary: /usr/local/bin/k3s
# At most this many packages are kept per host in a report.
updates_max_entries: 5000

# Releases the playbook updates, with the end of their support: the OS catalog's releases and dates
# (roles/os_catalog/vars/catalog.yml; a test keeps them the same), by the distribution's name in the facts
# (CentOS Stream is CentOS, Rocky Linux is Rocky). A release past its end still gets updates, with a warning
# in the report.
updates_supported_releases:
  - {distribution: Ubuntu, version: "22.04", eol: "2027-06-01"}
  - {distribution: Ubuntu, version: "24.04", eol: "2029-05-31"}
  - {distribution: Ubuntu, version: "26.04", eol: "2031-05-29"}
  - {distribution: Debian, version: "12", eol: "2028-06-30"}
  - {distribution: Debian, version: "13", eol: "2030-06-30"}
  - {distribution: CentOS, version: "9", eol: "2027-05-31"}
  - {distribution: CentOS, version: "10", eol: "2030-05-31"}
  - {distribution: Rocky, version: "9", eol: "2032-05-31"}
  - {distribution: Rocky, version: "10", eol: "2035-05-31"}
  - {distribution: AlmaLinux, version: "9", eol: "2032-05-31"}
  - {distribution: AlmaLinux, version: "10", eol: "2035-05-31"}
# The families the role has task files for (tasks/*/<os_family>.yml).
updates_families: [Debian, RedHat]
