---
# After a drained member's reboot and health check (apply.yml): wait until its node is Ready again, uncordon it from
# the server it was drained from, and with updates_k8s_wait_longhorn wait until every attached Longhorn volume is
# healthy, so that the next wave starts with every volume whole. A node that doesn't come back stays cordoned and
# fails the server.
- name: Wait until the node is Ready again
  ansible.builtin.command:
    argv:
      - "{{ updates_k8s_binary }}"
      - kubectl
      - get
      - node
      - "{{ updates_k8s_node_name }}"
      - -o
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: updates_k8s_ready
  until: updates_k8s_ready.rc == 0 and updates_k8s_ready.stdout == 'True'
  retries: "{{ (updates_k8s_ready_timeout | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  changed_when: false
  delegate_to: "{{ usas_updates_result.k8s.from }}"

- name: Uncordon the node
  ansible.builtin.command:
    argv: ["{{ updates_k8s_binary }}", kubectl, uncordon, "{{ updates_k8s_node_name }}"]
  changed_when: true
  delegate_to: "{{ usas_updates_result.k8s.from }}"

- name: Note that the node is uncordoned
  ansible.builtin.set_fact:
    usas_updates_result: >-
      {{ usas_updates_result | combine({'k8s': usas_updates_result.k8s | combine({'uncordoned': true})}) }}

- name: Wait until every Longhorn volume is healthy
  when: updates_k8s_wait_longhorn | bool
  block:
    - name: Read the Longhorn volumes until each attached one is healthy
      ansible.builtin.command:
        argv:
          - "{{ updates_k8s_binary }}"
          - kubectl
          - --namespace=longhorn-system
          - get
          - volumes.longhorn.io
          - -o
          - jsonpath={range .items[*]}{.metadata.name}={.status.state}/{.status.robustness}{"\n"}{end}
      register: updates_k8s_longhorn
      until: updates_k8s_longhorn.rc == 0 and updates_k8s_longhorn.stdout | usas_longhorn_unhealthy | length == 0
      retries: "{{ (updates_k8s_longhorn_timeout | int / 10) | round(0, 'ceil') | int }}"
      delay: 10
      changed_when: false
      failed_when: false
      delegate_to: "{{ usas_updates_result.k8s.from }}"

    - name: Fail unless every Longhorn volume is healthy
      ansible.builtin.assert:
        that: updates_k8s_longhorn.rc == 0 and updates_k8s_longhorn_bad | length == 0
        fail_msg: >-
          {{ "couldn't read Longhorn's volumes (updates_k8s_wait_longhorn: is Longhorn installed?): "
          ~ updates_k8s_longhorn.stderr | default('') | usas_clean_text(160) if updates_k8s_longhorn.rc != 0
          else "Longhorn volumes not healthy after " ~ updates_k8s_longhorn_timeout ~ " seconds: "
          ~ updates_k8s_longhorn_bad | join(', ') | usas_clean_text(200) }}
        quiet: true
      vars:
        updates_k8s_longhorn_bad: "{{ updates_k8s_longhorn.stdout | default('') | usas_longhorn_unhealthy }}"

    - name: Note that Longhorn is healthy
      ansible.builtin.set_fact:
        usas_updates_result: >-
          {{ usas_updates_result | combine({'k8s': usas_updates_result.k8s | combine({'longhorn': 'healthy'})}) }}
