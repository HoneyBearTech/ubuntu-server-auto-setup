---
- name: Restart unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: restarted
  when: not (ansible_check_mode and common_base_packages | default({}) is changed)

# As above: in check mode a service this run would install doesn't exist yet.
- name: Restart systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
  when: not (ansible_check_mode and common_time_sync_package | default({}) is changed)

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: "{{ common_os_chrony_service }}"
    state: restarted
  when: not (ansible_check_mode and common_time_sync_package | default({}) is changed)
