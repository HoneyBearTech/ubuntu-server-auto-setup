---
# Input formats this role accepts; the admin user name ends up in a sudoers file name.
common_username_pattern: '^[a-z_][a-z0-9_-]{0,31}\Z'
common_hostname_pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\Z'
# Mail addresses and the relay's host and user end up in apt and msmtp configuration files: no spaces, quotes
# or line breaks. The password is kept in a file of its own, so it only can't contain control characters.
# tests/fuzz/ reads them from here.
common_email_pattern: '^[A-Za-z0-9._+-]+@[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\Z'
common_mail_host_pattern: '^[A-Za-z0-9]([A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?\Z'
common_mail_user_pattern: '^[A-Za-z0-9._@+=-]*\Z'
common_mail_password_pattern: '^[^\x00-\x1f\x7f]*\Z'
common_mail_report_values: [always, only-on-error, on-change]
common_mail_tls_values: [starttls, tls, "off"]
# Packages that are a mail transfer agent already, which the relay would replace: the distribution's (vars/).
common_other_mtas: "{{ common_os_other_mtas }}"
common_msmtp_password_file: /etc/msmtp-password
# NTP servers and pools end up in chrony's and systemd-timesyncd's configuration: host names, IPv4 or IPv6
# addresses, without spaces (a space would add a chrony option) or line breaks. tests/fuzz/ reads it from here.
common_time_server_pattern: '^[A-Za-z0-9]([A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?\Z'
# NTP services that would be removed if the role installed systemd-timesyncd or chrony: the run stops instead.
common_time_sync_other_services: [ntp, ntpsec, openntpd]
common_timesyncd_dropin: /etc/systemd/timesyncd.conf.d/50-usas.conf
# The role's chrony sources, and the mark that turns the OS's own sources off (removed again to bring them back).
common_chrony_sources_file: usas.sources
common_chrony_off_mark: "#usas-time-sync# "
