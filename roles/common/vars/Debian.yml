---
# The apt family (Ubuntu and Debian), and Debian itself; vars/Ubuntu.yml overrides it for Ubuntu. Loaded by the
# role's first task: the family's file, then the distribution's, then the release's.
# Debian: point releases and Debian-Security (the codename-security suite); Debian has no ESM.
common_os_unattended_origins:
  - "${distro_id}:${distro_codename}"
  - "${distro_id}:${distro_codename}-security"

# The admin user's group for sudo, the base packages, and the loopback address the host name maps to.
common_os_admin_group: sudo
common_os_packages: [ca-certificates, curl, htop, unattended-upgrades, vim]
common_os_hosts_loopback: 127.0.1.1
# The mail relay's package (it provides /usr/sbin/sendmail) and the mail servers it would replace.
common_os_msmtp_package: msmtp-mta
common_os_other_mtas: [postfix, exim4-daemon-light, exim4-daemon-heavy, sendmail-bin, opensmtpd, nullmailer, dma, ssmtp,
                       courier-mta]
