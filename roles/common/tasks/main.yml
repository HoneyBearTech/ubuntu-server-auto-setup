---
- name: Check the admin user name and hostname
  ansible.builtin.assert:
    that:
      - admin_user is match(common_username_pattern)
      - not (manage_hostname | bool) or server_hostname is match(common_hostname_pattern)
    fail_msg: admin_user must be a lowercase Linux user name and server_hostname a valid host name.
    quiet: true

- name: Check the mail settings
  ansible.builtin.assert:
    that:
      - unattended_upgrades_mail | length == 0 or unattended_upgrades_mail is match(common_email_pattern)
      - unattended_upgrades_mail_report in common_mail_report_values
      - not (mail_relay_enabled | bool) or (mail_relay_host is match(common_mail_host_pattern)
        and mail_relay_port | string is match('^[0-9]+\Z') and 1 <= (mail_relay_port | int) <= 65535
        and mail_relay_tls in common_mail_tls_values
        and mail_relay_from is match(common_email_pattern)
        and mail_relay_user is match(common_mail_user_pattern))
    fail_msg: >-
      unattended_upgrades_mail and mail_relay_from must be plain mail addresses and unattended_upgrades_mail_report
      one of {{ common_mail_report_values | join(', ') }}; with mail_relay_enabled, mail_relay_host must be a host
      name or address, mail_relay_port a port, mail_relay_tls one of {{ common_mail_tls_values | join(', ') }} and
      mail_relay_user a user name without spaces, quotes or line breaks.
    quiet: true

- name: Check the mail relay password
  ansible.builtin.assert:
    that:
      - mail_relay_password is match(common_mail_password_pattern)
      - (mail_relay_user | length == 0) == (mail_relay_password | length == 0)
    fail_msg: mail_relay_user and mail_relay_password go together, and the password can't contain line breaks.
    quiet: true
  when: mail_relay_enabled | bool
  no_log: true

- name: Check for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: common_cloud_init

# Freshly installed servers finish creating users and keys in cloud-init on first boot.
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: common_cloud_init_status
  changed_when: false
  failed_when: common_cloud_init_status.rc not in [0, 2]
  when: common_cloud_init.stat.exists

# Also in check mode: refreshing the lists changes no packages, and without it a check run can't see
# which packages exist or would be upgraded.
- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  check_mode: false

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: "{{ pkg_upgrade }}"
    autoremove: true
  when: pkg_upgrade != 'no'

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages + (['qemu-guest-agent'] if ansible_facts.virtualization_type == 'kvm' else []) }}"
    state: present
  register: common_base_packages

# In check mode a service that this run would install doesn't exist yet, so it can't be checked.
- name: Start the QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
  when:
    - ansible_facts.virtualization_type == 'kvm'
    - not (ansible_check_mode and common_base_packages is changed)

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"
    use: systemd
  when: manage_hostname | bool

- name: Map the hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ (server_hostname ~ '.' ~ server_domain ~ ' ') if server_domain else '' }}{{ server_hostname }}"
    mode: "0644"
  when: manage_hostname | bool

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: "{{ admin_shell }}"
    groups: [sudo]
    append: true
    create_home: true
    password: "{{ (admin_password | string | password_hash('sha512')) if admin_password | string | length > 0 else omit }}"
    update_password: on_create
  register: common_admin_user
  no_log: true

- name: Configure sudo for the admin user
  ansible.builtin.copy:
    content: "{{ admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/90-ansible-{{ admin_user }}
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  when: admin_sudo_nopasswd | bool

# Without a password the admin user couldn't use sudo at all once passwordless sudo is gone.
- name: Check that sudo will still work with a password
  ansible.builtin.assert:
    that: admin_password | string | length > 0 or (ansible_become_password | default('') | string) | length > 0
    fail_msg: >-
      admin_sudo_nopasswd is false, so passwordless sudo is about to be removed, but neither admin_password
      nor ansible_become_password is set: {{ admin_user }} couldn't use sudo afterwards. Set the admin password
      in the Vault (and ansible_become_password to it), or set admin_sudo_nopasswd: true.
    quiet: true
  when: not admin_sudo_nopasswd | bool
  no_log: true

- name: Require a password for sudo
  ansible.builtin.file:
    path: /etc/sudoers.d/90-ansible-{{ admin_user }}
    state: absent
  when: not admin_sudo_nopasswd | bool

# Subiquity keeps a root-only copy of the autoinstall answers, password hash included.
- name: Remove the installer's copy of the autoinstall answers
  ansible.builtin.file:
    path: /var/log/installer/autoinstall-user-data
    state: absent

- name: Install SSH keys
  ansible.builtin.include_tasks: ssh_keys.yml
  tags: [ssh_keys]

- name: Set up the mail relay
  ansible.builtin.import_tasks: mail_relay.yml
  when: mail_relay_enabled | bool

# Also when the relay is turned off: the password shouldn't stay behind on the server.
- name: Remove an unused relay password
  ansible.builtin.file:
    path: "{{ common_msmtp_password_file }}"
    state: absent
  when: not (mail_relay_enabled | bool and mail_relay_password | length > 0)

- name: Look for a mail transfer agent
  ansible.builtin.stat:
    path: /usr/sbin/sendmail
  register: common_sendmail
  when: unattended_upgrades_mail | length > 0 and not mail_relay_enabled | bool

- name: Report that update mail can't be sent
  ansible.builtin.debug:
    msg: >-
      unattended_upgrades_mail is set, but {{ inventory_hostname }} has no mail transfer agent (/usr/sbin/sendmail),
      so the report can't be sent. Set mail_relay_enabled with a relay host, or install one yourself.
  when:
    - common_sendmail is not skipped
    - not common_sendmail.stat.exists

- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
  notify: Restart unattended-upgrades

- name: Turn on automatic updates
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: Reboot to finish upgrades
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: reboot_if_required | bool and common_reboot_required.stat.exists

- name: Report a pending reboot
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} needs a reboot to finish upgrades (set reboot_if_required: true to do it automatically)."
  when: not reboot_if_required | bool and common_reboot_required.stat.exists
