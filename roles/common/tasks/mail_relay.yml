---
- name: Read the installed packages
  ansible.builtin.package_facts:

# The relay would take over /usr/sbin/sendmail from any other mail transfer agent (Debian's msmtp-mta conflicts
# with them, so installing it would remove that one).
- name: Refuse to replace another mail server
  ansible.builtin.assert:
    that: common_other_mtas | select('in', ansible_facts.packages) | list | length == 0
    fail_msg: >-
      mail_relay_enabled would replace {{ common_other_mtas | select('in', ansible_facts.packages) | join(', ') }}
      on {{ inventory_hostname }}. Point that mail server at your relay instead and set mail_relay_enabled: false.
    quiet: true

- name: Enable EPEL, where msmtp comes from
  ansible.builtin.include_tasks:
    file: epel.yml
    apply:
      tags: [always]
  when: ansible_facts.os_family == 'RedHat'

- name: Install msmtp as the server's sendmail
  ansible.builtin.package:
    name: "{{ common_os_msmtp_package }}"
    state: present
  register: common_msmtp_install
  # A check run that would enable EPEL can't see its packages yet; the run that enables it installs them.
  when: not (ansible_check_mode and common_epel_install | default({}) is changed)

# Debian's msmtp-mta provides /usr/sbin/sendmail itself; the RHEL family's msmtp doesn't.
- name: Point /usr/sbin/sendmail at msmtp
  community.general.alternatives:
    name: mta
    link: /usr/sbin/sendmail
    path: /usr/bin/msmtp
    priority: 30
  when:
    - ansible_facts.os_family == 'RedHat'
    - not (ansible_check_mode and (common_msmtp_install is changed or common_msmtp_install is skipped))

- name: Configure the mail relay
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: "0600"

# Read by msmtp's passwordeval, so the password needs no quoting in msmtprc.
- name: Store the relay password
  ansible.builtin.copy:
    content: "{{ mail_relay_password }}"
    dest: "{{ common_msmtp_password_file }}"
    owner: root
    group: root
    mode: "0600"
  when: mail_relay_password | length > 0
  no_log: true
  diff: false
