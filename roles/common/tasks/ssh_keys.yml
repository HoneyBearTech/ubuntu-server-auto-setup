---
- name: Fetch public SSH keys from GitHub
  ansible.builtin.uri:
    url: "{{ github_keys_url }}"
    return_content: true
  register: common_github_keys
  delegate_to: localhost
  become: false
  check_mode: false
  when: github_user | length > 0
  tags: [ssh_keys]

- name: Collect the authorized keys
  ansible.builtin.set_fact:
    # Each key once, by its type and key material: a key both on GitHub and in admin_extra_ssh_keys (the web
    # UI's key can be a published one) would otherwise make authorized_key report a change on every run.
    # The later entry wins, so an extra key's comment is kept.
    common_ssh_keys: "{{ dict(common_ssh_keys_listed | map('split') | map('batch', 2) | map('first') | map('join', ' ')
      | zip(common_ssh_keys_listed)).values() | list }}"
  vars:
    # One key per line: the GitHub file and the extra keys are split on every line break, so no entry can
    # carry a second line into authorized_keys or the installer configuration.
    common_ssh_keys_listed: "{{ ((common_github_keys.content | default('')) ~ '\n' ~ (admin_extra_ssh_keys | join('\n'))).splitlines()
      | map('trim') | select('match', '^(ssh-|ecdsa-|sk-)') | list }}"
  tags: [ssh_keys]

# Guards against an empty GitHub response wiping authorized_keys and locking everyone out.
- name: Fail if there are no SSH keys
  ansible.builtin.assert:
    that: common_ssh_keys | length > 0
    fail_msg: No public keys found for github_user '{{ github_user }}' and admin_extra_ssh_keys is empty; refusing to touch authorized_keys.
    quiet: true
  tags: [ssh_keys]

- name: Install the authorized keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ common_ssh_keys | join('\n') }}"
    exclusive: "{{ ssh_keys_exclusive | bool }}"
    state: present
  # In check mode a user this run would create has no home directory to look in yet.
  when: not (ansible_check_mode and common_admin_user | default({}) is changed and common_admin_user.uid is not defined)
  tags: [ssh_keys]
