---
admin_user: sysadmin
admin_shell: /bin/bash
# Only used when the user doesn't exist yet (servers this repo didn't install).
admin_password: ""
# The installer grants passwordless sudo so the first baseline run can work unattended; with false (the
# default) that run removes it again, and later runs use ansible_become_password (the admin password).
admin_sudo_nopasswd: false

# Keys from https://github.com/<github_user>.keys plus any extras.
github_user: ""
github_keys_url: "https://github.com/{{ github_user }}.keys"
admin_extra_ssh_keys: []
# Remove keys that are no longer on GitHub (or in admin_extra_ssh_keys).
ssh_keys_exclusive: true

manage_hostname: true
server_hostname: "{{ inventory_hostname_short }}"
server_domain: ""            # adds "<ip> <host>.<domain> <host>" to /etc/hosts when set
timezone: Etc/UTC

# How the first and later runs upgrade packages: dist, safe, full or "no" (apt's upgrade modes; "no" skips it).
pkg_upgrade: "{{ apt_upgrade }}"
apt_upgrade: dist            # the name before 0.7.0, still read until 1.0: set pkg_upgrade instead
reboot_if_required: false    # reboot after upgrades when /var/run/reboot-required exists
# Installed on every server: the distribution's set (roles/common/vars), with qemu-guest-agent on a VM. Ubuntu and
# Debian: ca-certificates, curl, htop, unattended-upgrades, vim; the RHEL family: ca-certificates, dnf-automatic,
# dnf-plugins-core, vim-enhanced (curl-minimal provides curl).
common_packages: "{{ common_os_packages }}"

# What unattended-upgrades installs, as Allowed-Origins ("origin:suite"). The default is the distribution's
# (roles/common/vars): Ubuntu's release and security pockets plus ESM security; Debian's point releases and
# Debian-Security.
unattended_upgrades_origins: "{{ common_os_unattended_origins }}"
unattended_upgrades_auto_reboot: false
unattended_upgrades_reboot_time: "04:00"
unattended_upgrades_remove_unused: true
# Mail unattended-upgrades' report to this address (empty: no mail). Sending needs a mail transfer agent on
# the server: an existing one, or the msmtp relay below.
unattended_upgrades_mail: ""
unattended_upgrades_mail_report: on-change   # always, only-on-error or on-change

# --- Mail relay (msmtp) ---
# Install msmtp-mta as the server's sendmail, passing all mail to mail_relay_host. It replaces no other mail
# server: the run stops if one (Postfix, Exim...) is installed.
mail_relay_enabled: false
mail_relay_host: ""
mail_relay_port: 587
mail_relay_tls: starttls     # starttls, tls (implicit TLS, usually port 465) or "off"
# The sender address of the mail the server sends.
mail_relay_from: ""
# Sign in to the relay when set; the password belongs in the Vault ("{{ vault_mail_relay_password }}").
mail_relay_user: ""
mail_relay_password: ""
