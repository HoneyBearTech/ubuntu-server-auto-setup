---
# A Proxmox storage ID (Datacenter -> Storage): it is used in pvesm commands and in the VM's CD-ROM
# settings, so nothing else is accepted. The web UI checks its field against this pattern too.
pve_storage_id_pattern: '^[A-Za-z][A-Za-z0-9._-]{0,63}\Z'
# The node's SSH user: a Linux user name, as common_username_pattern (tests/fuzz/ checks they stay the same).
# It ends up in the SSH login, a home directory and an ACL entry.
pve_ssh_user_pattern: '^[a-z_][a-z0-9_-]{0,31}\Z'
# A folder the roles write the ISOs to: an absolute path, no line breaks or other control characters.
pve_iso_dir_pattern: '^/[^\x00-\x1f\x7f]*\Z'
# For a pve_ssh_user other than root, playbooks/prepare-node.yml records here (as root) the folder of each ISO
# storage the user may write to, as a JSON object: {"local": "/var/lib/vz/template/iso", ...}.
pve_iso_dirs_file: /etc/ubuntu-server-auto-setup/iso-dirs.json
# vm_os: an OS catalog id, such as ubuntu-26.04, debian-13 or centos-stream-10 (the catalog's own ids match it).
os_catalog_id_pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*-[0-9]+(\.[0-9]+)?\Z'
os_catalog_install_methods: [autoinstall, cloud_image]
os_catalog_families: [ubuntu, debian, rhel]
# vm_os_image_url, for an image the catalog doesn't have: HTTPS, a host name, and a path to a disk image with no
# query, spaces or control characters (the node downloads it with get_url).
vm_os_image_url_pattern: '^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*(:[0-9]{1,5})?(/[A-Za-z0-9._~%+-]+)+\.(qcow2|img|raw)\Z'
vm_os_image_sha256_pattern: '^[0-9a-f]{64}\Z'
# Releases built for x86-64-v3 only (AVX2, BMI2, FMA, MOVBE): their VMs need a CPU type and a node CPU that have
# it. AlmaLinux 10 isn't listed: the catalog pins its x86-64-v2 build.
os_catalog_x86_64_v3_ids: [centos-stream-10, rocky-10]
