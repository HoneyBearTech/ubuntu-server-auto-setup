---
# UFW on Ubuntu and Debian, firewalld on the RHEL family, driven by the same firewall_* settings. Dynamic, so its
# tasks get the tag here: they run whenever this include does (--tags firewall included).
- name: Configure the firewall
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts.os_family }}.yml"
    apply:
      tags: [always]
