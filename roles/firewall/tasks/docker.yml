---
# Docker-published ports (firewall_docker_enabled). Docker forwards them through its DOCKER-USER chain before
# UFW's rules see them, so UFW's after.rules and after6.rules fill that chain, between the role's markers. Only
# new connections Docker forwards to a published port (conntrack state DNAT) are dropped there unless allowed;
# replies and the containers' own connections pass. Turned off, the rules come out again.
- name: Check Docker-published ports can be filtered here
  ansible.builtin.assert:
    that: ansible_facts.os_family != 'RedHat'
    fail_msg: >-
      firewall_docker_enabled isn't available on {{ ansible_facts.distribution }} yet: Docker's ports there go
      through firewalld's docker zone, which this role doesn't manage. Leave firewall_docker_enabled off, and
      publish container ports only on the addresses that should reach them (-p 127.0.0.1:8080:80).
    quiet: true
  when: firewall_docker_enabled | bool

- name: Check the Docker port sources
  ansible.builtin.assert:
    that:
      - firewall_docker_sources is not string and firewall_docker_sources is not mapping
      - firewall_docker_sources | map('string') | select('match', firewall_docker_source_pattern) | list | length
        == firewall_docker_sources | length
    fail_msg: >-
      firewall_docker_sources must be a list of IPv4 or IPv6 addresses or networks (CIDR), like 10.0.0.0/24 or
      fd00::/8.
    quiet: true
  when: firewall_docker_enabled | bool

- name: Check the Docker port rules
  ansible.builtin.assert:
    that:
      - firewall_docker_allow is not string and firewall_docker_allow is not mapping
      - item is mapping
      - item.keys() | difference(firewall_docker_allow_keys) | length == 0
      - item.get('port', '') | string is match(firewall_docker_port_pattern)
      - item.port | string | split(':') | map('int') | select('ge', 1) | select('le', 65535) | list
        == item.port | string | split(':') | map('int') | sort
      - item.get('proto', 'tcp') in firewall_docker_protos
      - item.get('from', 'any') == 'any' or item.from | string is match(firewall_docker_source_pattern)
    fail_msg: >-
      Each firewall_docker_allow entry is { port, proto, from }: a port from 1 to 65535 or a range like 9000:9010
      (lower first), proto tcp, udp or any (default tcp), and from an IPv4 or IPv6 address or network, or any
      (the default).
    quiet: true
  loop: "{{ firewall_docker_allow if firewall_docker_allow is not string and firewall_docker_allow is not mapping
    else [firewall_docker_allow] }}"
  loop_control:
    label: "{{ item }}"
  when: firewall_docker_enabled | bool

# A check run on a server without UFW can't read its files; the run that installs it writes them.
- name: Filter Docker-published ports with UFW
  when: ansible_facts.os_family == 'Debian' and not (ansible_check_mode and firewall_ufw_install is changed)
  block:
    - name: Look for Docker
      ansible.builtin.service_facts:
      when: firewall_docker_enabled | bool

    - name: Work out whether to write the rules
      ansible.builtin.set_fact:
        firewall_docker_active: "{{ firewall_docker_enabled | bool
          and firewall_docker_services | select('in', ansible_facts.services | default({})) | list | length > 0 }}"

    - name: Say that Docker isn't installed
      ansible.builtin.debug:
        msg: >-
          firewall_docker_enabled is on, but Docker isn't installed on {{ inventory_hostname }}: no DOCKER-USER rules
          were written. Run the baseline again after installing Docker.
      when: firewall_docker_enabled | bool and not firewall_docker_active

    - name: Write the DOCKER-USER rules
      ansible.builtin.blockinfile:
        path: "{{ item.path }}"
        marker: "# {mark} USAS: Docker-published ports (firewall role, firewall_docker_enabled)"
        block: "{{ lookup('ansible.builtin.template', 'docker-user.rules.j2',
          template_vars={'firewall_docker_family': item.family}) }}"
        insertafter: EOF
        state: "{{ 'present' if firewall_docker_active else 'absent' }}"
        validate: "{{ item.restore }} --test --noflush %s"
      loop: "{{ firewall_docker_rules_files }}"
      loop_control:
        label: "{{ item.path }}"
      register: firewall_docker_rules
      notify: Reload UFW

    # A reload leaves a chain that after.rules no longer declares as it was: empty it, as Docker leaves it.
    - name: Empty the DOCKER-USER chain the rules filled
      ansible.builtin.command:
        argv: ["{{ item.restore | replace('-restore', '') }}", -w, -F, DOCKER-USER]
      loop: "{{ firewall_docker_rules.results | selectattr('changed') | map(attribute='item') | list }}"
      loop_control:
        label: "{{ item.path }}"
      when: not firewall_docker_active and not ansible_check_mode
      register: firewall_docker_flush
      changed_when: firewall_docker_flush.rc == 0
      failed_when: firewall_docker_flush.rc not in [0, 1]
