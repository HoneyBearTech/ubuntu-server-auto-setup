---
ssh_port: 22
# The default policy for incoming connections, and how much the firewall logs.
firewall_default_incoming: "{{ ufw_default_incoming }}"
firewall_logging: "{{ ufw_logging }}"
# Rate-limit SSH (UFW's "limit": 6 connections in 30 s per source) instead of a plain allow.
firewall_ssh_limit: "{{ ufw_ssh_limit }}"
# firewalld only: the limit for new SSH connections from all sources together (Fail2Ban limits each source).
firewall_ssh_limit_rate: 30/m
# Where SSH is allowed from. "any", or a list of addresses/CIDRs.
firewall_ssh_sources: "{{ ufw_ssh_sources }}"
# Extra rules, e.g.
#   - { port: "443", proto: tcp, comment: https }
#   - { port: "5432", proto: tcp, from: 10.0.0.0/24, comment: postgres }
firewall_allow: "{{ ufw_allow }}"
# UFW only: the default policy for outgoing connections (firewalld allows them).
ufw_default_outgoing: allow

# The names before 0.7.0, still read until 1.0: a firewall_* setting above takes its value from these unless it's
# set itself. Set the firewall_* names instead.
ufw_default_incoming: deny
ufw_logging: low
ufw_ssh_limit: true
ufw_ssh_sources: [any]
ufw_allow: []

# Docker-published ports. Docker forwards a published port (docker run -p, ports: in Compose) to its container
# through its own DOCKER-USER chain, before UFW's rules, so the port is open to everyone whatever UFW says. On,
# /etc/ufw/after.rules and after6.rules fill that chain: new connections to a published port are dropped unless
# they come from firewall_docker_sources or match firewall_docker_allow. Replies, and connections the containers
# make themselves, aren't affected. Skipped, with a message, on a server without Docker (run the baseline again
# after installing it). Not available on the RHEL family (firewalld) yet: the run stops there instead.
firewall_docker_enabled: false
# Addresses or networks (IPv4 or IPv6, CIDR) that may reach every published port.
firewall_docker_sources: []
# Published ports open to everyone, or to one network: the port on the server (8080 in -p 8080:80), or a range, e.g.
#   - { port: "8080", proto: tcp }
#   - { port: "9000:9010", proto: udp, from: 10.0.0.0/24 }
firewall_docker_allow: []
