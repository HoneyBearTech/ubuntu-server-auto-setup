---
- name: Test the Fail2Ban configuration
  ansible.builtin.command: fail2ban-client --test
  changed_when: false
  when: not (ansible_check_mode and (fail2ban_install | default({}) is changed or fail2ban_install | default({}) is skipped))
  listen: Restart fail2ban

- name: Restart the fail2ban service
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: not (ansible_check_mode and (fail2ban_install | default({}) is changed or fail2ban_install | default({}) is skipped))
  listen: Restart fail2ban
