---
# python3-systemd lets Fail2Ban read the journal (Ubuntu servers no longer log SSH to auth.log by default).
- name: Install Fail2Ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present

- name: Configure Fail2Ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable Fail2Ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

- name: Apply Fail2Ban changes now
  ansible.builtin.meta: flush_handlers

- name: Check that the sshd jail is running
  ansible.builtin.command: fail2ban-client status sshd
  register: fail2ban_sshd_status
  changed_when: false
  retries: 5
  delay: 3
  until: fail2ban_sshd_status.rc == 0
