---
# The family's packages (vars/Debian.yml, vars/RedHat.yml).
- name: Load the settings for the server's OS family
  ansible.builtin.include_vars:
    file: "{{ ansible_facts.os_family }}.yml"

- name: Check the Fail2Ban settings
  ansible.builtin.assert:
    that:
      - fail2ban_ignoreip | select('match', fail2ban_ignoreip_pattern) | list | length == fail2ban_ignoreip | length
      - fail2ban_bantime | string is match(fail2ban_time_pattern)
      - fail2ban_findtime | string is match(fail2ban_time_pattern)
      - fail2ban_bantime_maxtime | string is match(fail2ban_time_pattern)
      - fail2ban_banaction is match(fail2ban_banaction_pattern)
      - fail2ban_sshd_mode in fail2ban_sshd_modes
      - fail2ban_maxretry | string is match('^[0-9]+\Z')
    fail_msg: >-
      fail2ban_ignoreip entries must be addresses, ranges or host names; the times like 3600, 10m or 1h30m;
      fail2ban_maxretry a number; fail2ban_sshd_mode one of {{ fail2ban_sshd_modes | join(', ') }}.
    quiet: true

- name: Check the Fail2Ban notification settings
  ansible.builtin.assert:
    that:
      - fail2ban_destemail | length == 0 or fail2ban_destemail is match(fail2ban_email_pattern)
      - fail2ban_sender | length == 0 or fail2ban_sender is match(fail2ban_email_pattern)
      - fail2ban_webhook_format in fail2ban_webhook_formats
    fail_msg: >-
      fail2ban_destemail and fail2ban_sender must be plain mail addresses, and fail2ban_webhook_format one of
      {{ fail2ban_webhook_formats | join(', ') }}.
    quiet: true

# The URL may hold a token, so it is checked (and written) without showing it.
- name: Check the Fail2Ban webhook URL
  ansible.builtin.assert:
    that: fail2ban_webhook_url | length == 0 or fail2ban_webhook_url is match(fail2ban_webhook_url_pattern)
    fail_msg: >-
      fail2ban_webhook_url must be an http(s) URL without spaces, quotes, "%", "<", ">" or line breaks.
    quiet: true
  no_log: true

# The RHEL family gets Fail2Ban from EPEL, with fail2ban-firewalld, which makes firewalld's rich rules its ban
# action.
- name: Enable EPEL, where Fail2Ban comes from
  ansible.builtin.include_role:
    name: common
    tasks_from: epel
    apply:
      tags: [always]
  when: ansible_facts.os_family == 'RedHat'

# python3-systemd lets Fail2Ban read the journal (servers no longer log SSH to auth.log by default).
- name: Install Fail2Ban
  ansible.builtin.package:
    name: >-
      {{ fail2ban_os_packages + (fail2ban_os_webhook_packages if fail2ban_webhook_url | length > 0 else [])
         + (fail2ban_os_mail_packages if fail2ban_destemail | length > 0 else []) }}
    state: present
  register: fail2ban_install
  # A check run that would enable EPEL can't see its packages yet; the run that enables it installs them.
  when: not (ansible_check_mode and common_epel_install | default({}) is changed)

- name: Write the webhook action
  ansible.builtin.template:
    src: usas-webhook.conf.j2
    dest: "{{ fail2ban_webhook_action_file }}"
    owner: root
    group: root
    mode: "0600"
  when: fail2ban_webhook_url | length > 0
  no_log: true
  diff: false
  notify: Restart fail2ban

- name: Remove an unused webhook action
  ansible.builtin.file:
    path: "{{ fail2ban_webhook_action_file }}"
    state: absent
  when: fail2ban_webhook_url | length == 0
  notify: Restart fail2ban

- name: Configure Fail2Ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

# In check mode Fail2Ban can't be started or asked about its jail before this run has installed it.
- name: Enable Fail2Ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  when: not (ansible_check_mode and (fail2ban_install is changed or fail2ban_install is skipped))

- name: Apply Fail2Ban changes now
  ansible.builtin.meta: flush_handlers

- name: Check that the sshd jail is running
  ansible.builtin.command: fail2ban-client status sshd
  register: fail2ban_sshd_status
  changed_when: false
  retries: 5
  delay: 3
  until: fail2ban_sshd_status.rc == 0
  when: not (ansible_check_mode and (fail2ban_install is changed or fail2ban_install is skipped))
