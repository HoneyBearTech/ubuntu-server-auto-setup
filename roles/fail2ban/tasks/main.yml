---
- name: Check the Fail2Ban settings
  ansible.builtin.assert:
    that:
      - fail2ban_ignoreip | select('match', fail2ban_ignoreip_pattern) | list | length == fail2ban_ignoreip | length
      - fail2ban_bantime | string is match(fail2ban_time_pattern)
      - fail2ban_findtime | string is match(fail2ban_time_pattern)
      - fail2ban_bantime_maxtime | string is match(fail2ban_time_pattern)
      - fail2ban_banaction is match(fail2ban_banaction_pattern)
      - fail2ban_sshd_mode in fail2ban_sshd_modes
      - fail2ban_maxretry | string is match('^[0-9]+\Z')
    fail_msg: >-
      fail2ban_ignoreip entries must be addresses, ranges or host names; the times like 3600, 10m or 1h30m;
      fail2ban_maxretry a number; fail2ban_sshd_mode one of {{ fail2ban_sshd_modes | join(', ') }}.
    quiet: true

# python3-systemd lets Fail2Ban read the journal (Ubuntu servers no longer log SSH to auth.log by default).
- name: Install Fail2Ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present
  register: fail2ban_install

- name: Configure Fail2Ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

# In check mode Fail2Ban can't be started or asked about its jail before this run has installed it.
- name: Enable Fail2Ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  when: not (ansible_check_mode and fail2ban_install is changed)

- name: Apply Fail2Ban changes now
  ansible.builtin.meta: flush_handlers

- name: Check that the sshd jail is running
  ansible.builtin.command: fail2ban-client status sshd
  register: fail2ban_sshd_status
  changed_when: false
  retries: 5
  delay: 3
  until: fail2ban_sshd_status.rc == 0
  when: not (ansible_check_mode and fail2ban_install is changed)
