---
- name: Check the ISO file names
  ansible.builtin.assert:
    that:
      - ubuntu_iso_name is match(installer_iso_name_pattern)
      - installer_iso_name is match(installer_iso_name_pattern)
    fail_msg: ubuntu_iso_name may contain only letters, digits, dots, underscores, plus signs and hyphens.
    quiet: true

# As gpgv prints it: capitals, no spaces.
- name: Normalize the signing key's fingerprint
  ansible.builtin.set_fact:
    installer_signing_fpr: "{{ installer_signing_fingerprint | string | replace(' ', '') | upper }}"

- name: Check the signing key's fingerprint
  ansible.builtin.assert:
    that: installer_signing_fpr is match('^[0-9A-F]{40}\\Z')
    fail_msg: installer_signing_fingerprint must be the signing key's full 40-digit hexadecimal fingerprint.
    quiet: true

- name: Find the ISO storage's folder
  ansible.builtin.include_role:
    name: ubuntu_release
    tasks_from: iso_dir

- name: Install ISO and signature tooling
  ansible.builtin.apt:
    name: [xorriso, gpgv]
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: installer_tools

# Check mode runs the next four tasks too: they only write to the role's own work directory, and the
# signature and checksum checks after them need their files.
- name: Create the work directory
  ansible.builtin.file:
    path: "{{ installer_work_dir }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: Copy the keyring with Ubuntu's CD image signing key
  ansible.builtin.copy:
    src: "{{ installer_signing_keyring }}"
    dest: "{{ installer_work_dir }}/signing-keyring.gpg"
    mode: "0644"
  check_mode: false

- name: Fetch Ubuntu's SHA256SUMS
  ansible.builtin.get_url:
    url: "{{ ubuntu_iso_base_url }}/SHA256SUMS"
    dest: "{{ installer_work_dir }}/SHA256SUMS"
    force: true
    mode: "0644"
  check_mode: false

- name: Fetch the signature on SHA256SUMS
  block:
    - name: Fetch SHA256SUMS.gpg
      ansible.builtin.get_url:
        url: "{{ ubuntu_iso_base_url }}/SHA256SUMS.gpg"
        dest: "{{ installer_work_dir }}/SHA256SUMS.gpg"
        force: true
        mode: "0644"
      check_mode: false
  rescue:
    - name: Fail if Ubuntu's SHA256SUMS isn't signed
      ansible.builtin.fail:
        msg: >-
          Couldn't fetch {{ ubuntu_iso_base_url }}/SHA256SUMS.gpg ({{ ansible_failed_result.status_code | default('') }}
          {{ ansible_failed_result.msg | default('') }}), so the checksums can't be trusted. A mirror must publish
          the signature next to SHA256SUMS.

- name: Verify the signature on SHA256SUMS
  ansible.builtin.command:
    argv:
      - gpgv
      - --status-fd
      - "1"
      - --keyring
      - "{{ installer_work_dir }}/signing-keyring.gpg"
      - "{{ installer_work_dir }}/SHA256SUMS.gpg"
      - "{{ installer_work_dir }}/SHA256SUMS"
  register: installer_gpgv
  changed_when: false
  failed_when: false
  check_mode: false
  # A check run doesn't install gpgv, and doesn't download the ISO either.
  when: not (ansible_check_mode and installer_tools is changed)

# VALIDSIG's last field is the fingerprint of the signing key's primary key: only a good signature by the
# pinned key passes, whatever else the keyring holds.
- name: Fail unless Ubuntu's signing key signed SHA256SUMS
  ansible.builtin.assert:
    that:
      - installer_gpgv.rc == 0
      - installer_gpgv.stdout is search('(?m)^\\[GNUPG:\\] VALIDSIG [0-9A-F]{40} .* ' ~ installer_signing_fpr ~ '$')
    fail_msg: >-
      The signature on {{ ubuntu_iso_base_url }}/SHA256SUMS is bad or isn't by the key {{ installer_signing_fpr }},
      so the ISO's checksum can't be trusted: {{ installer_gpgv.stderr | default('') }}
    quiet: true
  when: installer_gpgv is not skipped

# The checksum is read from the file whose signature was just checked, not fetched again.
- name: Read the verified SHA256SUMS
  ansible.builtin.slurp:
    src: "{{ installer_work_dir }}/SHA256SUMS"
  register: installer_sums

- name: Pick the checksum for {{ ubuntu_iso_name }}
  ansible.builtin.set_fact:
    installer_iso_sha256: >-
      {{ installer_sums.content | b64decode
         | regex_findall('^([0-9a-f]{64}) \*?' ~ (ubuntu_iso_name | regex_escape) ~ '$', multiline=True)
         | default([''], true) | first }}

- name: Fail if Ubuntu doesn't publish {{ ubuntu_iso_name }}
  ansible.builtin.assert:
    that: installer_iso_sha256 | length == 64
    fail_msg: >-
      {{ ubuntu_iso_name }} is not listed in {{ ubuntu_iso_base_url }}/SHA256SUMS. A newer point release
      has probably replaced it: set ubuntu_point_release, or point ubuntu_iso_base_url at old-releases.ubuntu.com.
    quiet: true

- name: Download the Ubuntu Server ISO (checksum from the signed SHA256SUMS)
  ansible.builtin.get_url:
    url: "{{ ubuntu_iso_base_url }}/{{ ubuntu_iso_name }}"
    dest: "{{ pve_iso_dir }}/{{ ubuntu_iso_name }}"
    checksum: "sha256:{{ installer_iso_sha256 }}"
    mode: "0644"
    timeout: 120

- name: Check for an existing autoinstall ISO
  ansible.builtin.stat:
    path: "{{ pve_iso_dir }}/{{ installer_iso_name }}"
    get_checksum: false
  register: installer_iso_stat

- name: Remaster the ISO for hands-off install
  when: not installer_iso_stat.stat.exists or installer_iso_rebuild | bool
  block:
    - name: Remove stale grub.cfg
      ansible.builtin.file:
        path: "{{ installer_work_dir }}/grub.cfg"
        state: absent

    - name: Extract grub.cfg from the ISO
      ansible.builtin.command:
        argv:
          - xorriso
          - -osirrox
          - "on"
          - -indev
          - "{{ pve_iso_dir }}/{{ ubuntu_iso_name }}"
          - -extract
          - /boot/grub/grub.cfg
          - "{{ installer_work_dir }}/grub.cfg"
      changed_when: true

    - name: Make grub.cfg writable
      ansible.builtin.file:
        path: "{{ installer_work_dir }}/grub.cfg"
        mode: "0600"

    # Subiquity asks before wiping disks unless "autoinstall" is on the kernel command line.
    - name: Add the autoinstall kernel argument
      ansible.builtin.replace:
        path: "{{ installer_work_dir }}/grub.cfg"
        regexp: '^(\s*linux\s+/casper/\S*vmlinuz)(?!.*\bautoinstall\b)'
        replace: '\1 autoinstall'

    - name: Shorten the GRUB timeout
      ansible.builtin.replace:
        path: "{{ installer_work_dir }}/grub.cfg"
        regexp: '^set timeout=.*$'
        replace: "set timeout={{ installer_grub_timeout }}"

    - name: Read back grub.cfg
      ansible.builtin.slurp:
        src: "{{ installer_work_dir }}/grub.cfg"
      register: installer_grub_cfg

    - name: Fail if the autoinstall argument wasn't added
      ansible.builtin.assert:
        # Double backslashes: Jinja would turn a single \b into a backspace character.
        that: (installer_grub_cfg.content | b64decode) is search('/casper/\\S*vmlinuz\\s.*\\bautoinstall\\b')
        fail_msg: The ISO's grub.cfg has no /casper/vmlinuz line to patch; its layout has changed.
        quiet: true

    - name: Remove a partial build
      ansible.builtin.file:
        path: "{{ installer_work_dir }}/{{ installer_iso_name }}"
        state: absent

    # -boot_image any replay keeps the original El Torito, MBR and GPT boot records.
    - name: Build the remastered ISO
      ansible.builtin.command:
        argv:
          - xorriso
          - -indev
          - "{{ pve_iso_dir }}/{{ ubuntu_iso_name }}"
          - -outdev
          - "{{ installer_work_dir }}/{{ installer_iso_name }}"
          - -map
          - "{{ installer_work_dir }}/grub.cfg"
          - /boot/grub/grub.cfg
          - -boot_image
          - any
          - replay
      changed_when: true

    - name: Move the ISO into Proxmox ISO storage
      ansible.builtin.command:
        argv:
          - mv
          - -f
          - "{{ installer_work_dir }}/{{ installer_iso_name }}"
          - "{{ pve_iso_dir }}/{{ installer_iso_name }}"
      changed_when: true

    - name: Set ISO permissions
      ansible.builtin.file:
        path: "{{ pve_iso_dir }}/{{ installer_iso_name }}"
        mode: "0644"
