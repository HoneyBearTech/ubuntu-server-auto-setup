---
# As gpgv prints it: capitals, no spaces.
- name: Normalize the signing key's fingerprint
  ansible.builtin.set_fact:
    installer_signing_fpr: "{{ installer_signing_fingerprint | string | replace(' ', '') | upper }}"

- name: Check the signing key's fingerprint
  ansible.builtin.assert:
    that: installer_signing_fpr is match('^[0-9A-F]{40}\\Z')
    fail_msg: installer_signing_fingerprint must be the signing key's full 40-digit hexadecimal fingerprint.
    quiet: true

# Each storage's folder is looked up in storage.yml; a pve_iso_dir set in the inventory overrides every lookup.
- name: Keep the ISO folder set in the inventory, if any
  ansible.builtin.set_fact:
    installer_iso_dir_override: "{{ pve_iso_dir | default('') }}"

- name: Install ISO and signature tooling
  ansible.builtin.apt:
    name: [xorriso, gpgv]
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: installer_tools
  when: pve_ssh_user == 'root'

# Any other user can't install packages: prepare-node.yml did, as root.
- name: List the node's packages
  ansible.builtin.package_facts:
  when: pve_ssh_user != 'root'

- name: Fail if xorriso or gpgv is missing
  ansible.builtin.assert:
    that:
      - "'xorriso' in ansible_facts.packages"
      - "'gpgv' in ansible_facts.packages"
    fail_msg: >-
      {{ pve_ssh_user }} can't install packages, and xorriso or gpgv isn't installed on {{ inventory_hostname }}.
      Run playbooks/prepare-node.yml, or as root on the node: apt install xorriso gpgv
    quiet: true
  when: pve_ssh_user != 'root'

# Check mode runs the next four tasks too: they only write to the role's own work directory, and the
# signature and checksum checks after them need their files.
- name: Create the work directory
  ansible.builtin.file:
    path: "{{ installer_work_dir }}"
    state: directory
    mode: "0700"
  check_mode: false

# It is under /var/tmp, where anyone could have made it first, or put a link there to somewhere else.
- name: Look at the work directory
  ansible.builtin.stat:
    path: "{{ installer_work_dir }}"
    follow: false
    get_checksum: false
  register: installer_work_dir_stat

- name: Fail unless the work directory belongs to the node user
  ansible.builtin.assert:
    that:
      - installer_work_dir_stat.stat.isdir | default(false)
      - not installer_work_dir_stat.stat.islnk | default(true)
      - installer_work_dir_stat.stat.pw_name | default('') == pve_ssh_user
      - installer_work_dir_stat.stat.mode | default('') == '0700'
    fail_msg: >-
      {{ installer_work_dir }} on {{ inventory_hostname }} must be a folder (not a link) that only {{ pve_ssh_user }}
      can use (mode 0700). Remove it, or run playbooks/prepare-node.yml again to hand it to {{ pve_ssh_user }}.
    quiet: true

# The ISOs and cloud images the plan gave this node (installer_isos), with the settings of the servers that need
# them (an image has a url); without a plan, the node's own release in pve_iso_storage.
- name: List the installer ISOs to build and the cloud images to download
  ansible.builtin.set_fact:
    installer_iso_list: >-
      {{ [{'url': '', 'checksum': ''}] | product(installer_isos if installer_isos | length > 0
         else [{'storage': pve_iso_storage, 'name': ubuntu_iso_name, 'release': ubuntu_release | string,
                'point_release': ubuntu_point_release | string, 'base_url': ubuntu_iso_base_url}]) | map('combine') | list }}

- name: Put each installer ISO in its ISO storages
  ansible.builtin.include_tasks: iso.yml
  vars:
    ubuntu_release: "{{ installer_iso.release }}"
    ubuntu_point_release: "{{ installer_iso.point_release }}"
    ubuntu_iso_base_url: "{{ installer_iso.base_url }}"
    ubuntu_iso_name: "{{ installer_iso.name }}"
    installer_iso_storages: >-
      {{ installer_iso_list | selectattr('name', 'equalto', installer_iso.name) | map(attribute='storage') | list }}
  loop: "{{ installer_iso_list | rejectattr('url') | unique(attribute='name') | list }}"
  loop_control:
    loop_var: installer_iso
    label: "{{ installer_iso.name }}"

# The cloud images the plan gave this node, each into the Import folder of each storage that needs it.
- name: Put each cloud image in its storages' Import folders
  ansible.builtin.include_tasks: image.yml
  vars:
    installer_image_storages: >-
      {{ installer_iso_list | selectattr('name', 'equalto', installer_image.name) | map(attribute='storage') | list }}
  loop: "{{ installer_iso_list | selectattr('url') | unique(attribute='name') | list }}"
  loop_control:
    loop_var: installer_image
    label: "{{ installer_image.name }}"
