---
# Input formats this role accepts, checked before anything is created. They keep inventory values from
# breaking out of the installer's YAML and shell commands; tests/fuzz/ reads them from here.
provision_username_pattern: '^[a-z_][a-z0-9_-]{0,31}\Z'
provision_hostname_pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\Z'
provision_ipv4_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\Z'
