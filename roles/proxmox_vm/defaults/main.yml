---
# --- Proxmox API (set in inventory; token values come from Ansible Vault) ---
pve_api_host: ""
pve_api_port: 8006
pve_api_user: ansible@pve
pve_api_token_id: ""          # token name only, e.g. "automation"
pve_api_token_secret: ""
pve_validate_certs: true
# Seconds Proxmox may take to answer one API request. Allocating disks (LVM-thin, ZFS, Ceph) can keep the
# API busy for longer than the Proxmox modules' own 5-second default.
pve_api_timeout: 60
pve_api_url: "https://{{ pve_api_host }}:{{ pve_api_port }}/api2/json"
# Hide API tokens and the password hash from task output. Set false only while debugging.
pve_hide_secrets: true

# --- Placement ---
pve_node: ""                   # Proxmox node name
pve_ssh_host: "{{ pve_node }}" # inventory host used to reach that node over SSH
pve_storage: local-lvm         # storage for the VM disks
pve_efidisk_format: raw        # raw for LVM/ZFS/Ceph, qcow2 for directory storage
# Storage for the vTPM's state (vm_disk_encryption). Somewhere other than pve_storage keeps a copy of the
# disks' storage alone from holding what unlocks them.
pve_tpmstate_storage: "{{ pve_storage }}"
pve_bridge: vmbr0              # bridge of the first network card, net0
pve_vlan: ""                   # VLAN tag of net0 (1-4094), empty for none
pve_vmid: ""                   # required, fixed per host so reruns can find the VM
# Proxmox tags on a new VM: its distribution (vm_os without the release: ubuntu, debian, centos-stream, rocky,
# alma) and ansible.
pve_tags: ["{{ vm_os | regex_replace('-[0-9][0-9.]*$', '') }}", ansible]
# Hosts that share a vm_spread_group (any name, such as k8s-lab-servers) must have their VMs on different nodes,
# so one node going down takes only one of them. Checked before anything is created, against where existing
# VMs run now, for every host in the inventory with that group, not only those the run includes. Empty for none.
vm_spread_group: ""

# --- VM hardware ---
vm_cores: 2
vm_sockets: 1
vm_cpu_type: host
vm_memory_mb: 2048
vm_disk_gb: 32
# More disks (scsi1, scsi2, ...), each a mapping with these keys (size_gb, label and mount are needed):
#   size_gb (1-65536); storage (default pve_storage); label (the file system's label, lowercase letters, digits,
#   '-' and '_', at most 12); mount (an absolute path); fs (ext4 or xfs, default ext4).
# New VMs only: an existing VM isn't given disks. The baseline (data_disks role) formats each disk while it is
# still blank, never one that already holds data, and mounts it by label with nofail. Example:
#   vm_extra_disks:
#     - { size_gb: 100, label: longhorn, mount: /var/lib/longhorn }
vm_extra_disks: []
# Pre-enroll Microsoft's Secure Boot keys in the EFI disk, so the firmware boots only signed code (Ubuntu's
# shim, GRUB and kernel). New VMs only; set false for a VM that must boot unsigned kernels or modules.
vm_secure_boot: true
# Encrypt the root disk with LUKS2 and unlock it at boot with a virtual TPM (Proxmox vTPM). The TPM releases
# the key only while Secure Boot state (PCR 7) is unchanged, so this needs vm_secure_boot and the lvm layout.
# It protects a copied disk image or backup, not a VM whose Proxmox host is compromised: see docs/security.md.
vm_disk_encryption: false
# The LUKS passphrase, set it to "{{ vault_disk_passphrase }}". It stays enrolled as the recovery key for
# the console. 12 to 512 printable ASCII characters, no braces.
vm_disk_passphrase: ""
vm_onboot: true
# How long to wait for the installer to finish and power off the VM.
vm_install_timeout: 3600
vm_install_poll_interval: 20   # seconds between status checks

# --- Installed system ---
admin_user: sysadmin
admin_realname: Administrator
admin_password: ""             # from Vault; hashed (SHA-512) before it goes in the seed
github_user: ""
github_keys_url: "https://github.com/{{ github_user }}.keys"
admin_extra_ssh_keys: []       # extra public keys besides the GitHub ones
# --- Network ---
# How the first network card gets its IPv4 address: static (ansible_host, net_prefix and net_gateway) or dhcp.
# With dhcp and no ansible_host, the address is read from the QEMU guest agent once the installed system boots
# and used as ansible_host for the rest of the run; the API token needs VM.GuestAgent.Audit (PVE 9) or
# VM.Monitor (PVE 8). With dhcp and an ansible_host (an address reserved for net_mac), that address is used.
net_mode: static
net_prefix: 24
net_gateway: ""
net_dns: []
net_search: []
# MAC address of net0, for example to reserve its DHCP address on the router. Empty uses one derived from the
# host name and VM ID, so a VM created again gets the same one.
net_mac: ""
vm_nic_model: virtio           # model of every network card unless a card sets its own
# Seconds to wait for the guest agent to report the address DHCP gave net0.
net_dhcp_timeout: 300
# More network cards (net1, net2, ...), each a mapping with these keys (only mode is needed for dhcp or none):
#   mode: static, dhcp or none (attached, no address); bridge (default pve_bridge); vlan (1-4094);
#   model (default vm_nic_model); mac (default derived like net_mac); mtu (576-9216, virtio only);
#   address and prefix (static only); gateway (static only, if this card has the default route instead of net0).
# The installed system matches each card by its MAC address. Example:
#   vm_extra_nics:
#     - { bridge: vmbr1, vlan: 20, mode: static, address: 10.20.0.61, prefix: 24 }
#     - { bridge: vmbr1, vlan: 30, mode: dhcp }
vm_extra_nics: []
autoinstall_locale: en_US.UTF-8
autoinstall_keyboard_layout: us
autoinstall_source_id: ubuntu-server   # or ubuntu-server-minimal
autoinstall_storage_layout: lvm        # lvm, direct or zfs
autoinstall_updates: security          # security or all
autoinstall_packages:
  - qemu-guest-agent

# Replace the control node's known_hosts entry for the new VM with its fresh host key.
provision_manage_known_hosts: true
provision_known_hosts_file: "~/.ssh/known_hosts"
