---
# --- Proxmox API (set in inventory; token values come from Ansible Vault) ---
pve_api_host: ""
pve_api_port: 8006
pve_api_user: ansible@pve
pve_api_token_id: ""          # token name only, e.g. "automation"
pve_api_token_secret: ""
pve_validate_certs: true
# Seconds Proxmox may take to answer one API request. Allocating disks (LVM-thin, ZFS, Ceph) can keep the
# API busy for longer than the Proxmox modules' own 5-second default.
pve_api_timeout: 60
pve_api_url: "https://{{ pve_api_host }}:{{ pve_api_port }}/api2/json"
# Hide API tokens and the password hash from task output. Set false only while debugging.
pve_hide_secrets: true

# --- Placement ---
pve_node: ""                   # Proxmox node name
pve_ssh_host: "{{ pve_node }}" # inventory host used to reach that node over SSH
pve_storage: local-lvm         # storage for the VM disks
pve_efidisk_format: raw        # raw for LVM/ZFS/Ceph, qcow2 for directory storage
pve_bridge: vmbr0
pve_vlan: ""                   # VLAN tag, empty for none
pve_vmid: ""                   # required, fixed per host so reruns can find the VM
pve_tags: [ubuntu, ansible]

# --- VM hardware ---
vm_cores: 2
vm_sockets: 1
vm_cpu_type: host
vm_memory_mb: 2048
vm_disk_gb: 32
# Pre-enroll Microsoft's Secure Boot keys in the EFI disk, so the firmware boots only signed code (Ubuntu's
# shim, GRUB and kernel). New VMs only; set false for a VM that must boot unsigned kernels or modules.
vm_secure_boot: true
# Encrypt the root disk with LUKS2 and unlock it at boot with a virtual TPM (Proxmox vTPM). The TPM releases
# the key only while Secure Boot state (PCR 7) is unchanged, so this needs vm_secure_boot and the lvm layout.
# It protects a copied disk image or backup, not a VM whose Proxmox host is compromised: see docs/security.md.
vm_disk_encryption: false
# The LUKS passphrase, set it to "{{ vault_disk_passphrase }}". It stays enrolled as the recovery key for
# the console. 12 to 512 printable ASCII characters, no braces.
vm_disk_passphrase: ""
vm_onboot: true
# How long to wait for the installer to finish and power off the VM.
vm_install_timeout: 3600
vm_install_poll_interval: 20   # seconds between status checks

# --- Installed system ---
admin_user: sysadmin
admin_realname: Administrator
admin_password: ""             # from Vault; hashed (SHA-512) before it goes in the seed
github_user: ""
github_keys_url: "https://github.com/{{ github_user }}.keys"
admin_extra_ssh_keys: []       # extra public keys besides the GitHub ones
net_prefix: 24
net_gateway: ""
net_dns: []
net_search: []
net_interface_match: "en*"
autoinstall_locale: en_US.UTF-8
autoinstall_keyboard_layout: us
autoinstall_source_id: ubuntu-server   # or ubuntu-server-minimal
autoinstall_storage_layout: lvm        # lvm, direct or zfs
autoinstall_updates: security          # security or all
autoinstall_packages:
  - qemu-guest-agent

# Replace the control node's known_hosts entry for the new VM with its fresh host key.
provision_manage_known_hosts: true
provision_known_hosts_file: "~/.ssh/known_hosts"
