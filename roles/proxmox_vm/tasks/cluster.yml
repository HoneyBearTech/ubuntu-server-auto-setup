---
# Checks every host's placement against the cluster at once, before anything is created: its node must be one
# of the cluster's nodes, its ISO storage must allow ISO images (and Import content, for a cloud image) and be
# active on that node, and no two hosts of one vm_spread_group may be on one node. pve_placements
# is the play's list of {host, node, ssh_host, storage} (see filter_plugins/pve_cluster.py), pve_spread_candidates
# the hosts whose vm_spread_group counts and pve_vms the cluster's VMs. One API endpoint,
# any member of the cluster, answers for all of its nodes. Leaves pve_node_storages for the ISO plan.
- name: Check the hosts' nodes and ISO storages against the cluster
  run_once: true
  delegate_to: localhost
  become: false
  block:
    - name: List the cluster's nodes
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes"
        headers: "{{ pve_api_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        timeout: "{{ pve_api_timeout | int }}"
      register: pve_nodes
      # A dropped connection (pveproxy restarting a worker) is retried; any answer from Proxmox is final.
      until: pve_nodes.status | default(-1) | int != -1
      retries: 3
      delay: 5
      check_mode: false
      no_log: "{{ pve_hide_secrets }}"

    # Proxmox node names are case-sensitive (usually the lowercase host name), and a wrong one would only fail
    # later, inside the API call that creates the VM.
    - name: Check that every host's node is one of them
      vars:
        pve_node_names: "{{ pve_nodes.json.data | map(attribute='node') | sort }}"
        pve_bad_nodes: "{{ pve_placements | pve_unknown_nodes(pve_node_names) }}"
      ansible.builtin.assert:
        that: pve_bad_nodes | length == 0
        fail_msg: >-
          pve_node isn't a node in this cluster for {{ pve_bad_nodes | length }} host(s):
          {% for b in pve_bad_nodes %}{{ b.host }} ('{{ b.node }}'{{ ', did you mean ' ~ b.did_you_mean if b.did_you_mean
          else '' }}){{ '; ' if not loop.last else '.' }}{% endfor %}
          Its nodes are {{ pve_node_names | join(', ') }}{{ ' (node names are case-sensitive)'
          if pve_bad_nodes | selectattr('did_you_mean') | list else '' }}. One inventory places VMs on the nodes of
          one cluster, the one pve_api_host belongs to.
        quiet: true

    - name: List the ISO storages of each node used
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes/{{ item | urlencode }}/storage?content=iso"
        headers: "{{ pve_api_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        timeout: "{{ pve_api_timeout | int }}"
      loop: "{{ pve_placements | map(attribute='node') | unique | sort }}"
      register: pve_node_storage_lists
      # A dropped connection (pveproxy restarting a worker) is retried; any answer from Proxmox is final.
      until: pve_node_storage_lists.status | default(-1) | int != -1
      retries: 3
      delay: 5
      check_mode: false
      no_log: "{{ pve_hide_secrets }}"

    - name: Keep each node's ISO storages
      ansible.builtin.set_fact:
        pve_node_storages: "{{ pve_node_storage_lists.results | pve_storages_by_node }}"

    - name: Check that every host's ISO storage is on its node
      vars:
        pve_bad_storages: "{{ pve_placements | pve_storage_problems(pve_node_storages) }}"
      ansible.builtin.assert:
        that: pve_bad_storages | length == 0
        fail_msg: >-
          {% for b in pve_bad_storages %}{{ b.host }}: storage '{{ b.storage }}' doesn't allow ISO images{{
          ' and Import content (for the cloud image)' if b.cloud_image else '' }} on node {{ b.node }}, or isn't active there
          ({{ 'storages with both' if b.cloud_image else 'ISO storages' }} there: {{ b.available | join(', ') or 'none' }}).
          {% endfor %}Set pve_iso_storage to one of them, or allow the content on the storage for that node
          (Datacenter → Storage → Content: ISO image{{ ' and Import' if pve_bad_storages | selectattr('cloud_image') | list
          else '' }}, and Nodes).
        quiet: true

    # Hosts sharing a vm_spread_group (a Kubernetes cluster's servers, say) must not share a node, or one node
    # going down takes several of them. An existing VM counts where it runs now (it may have been migrated), any
    # other host where pve_node puts it. Only when VMs are created: the ISO plan passes no pve_spread_candidates.
    - name: Check the spread groups
      when: pve_spread_candidates is defined
      block:
        - name: Start the list of hosts in a spread group
          ansible.builtin.set_fact:
            pve_spread_hosts: []

        - name: Collect the hosts that are in a spread group
          ansible.builtin.set_fact:
            pve_spread_hosts: >-
              {{ pve_spread_hosts + [{'host': item, 'group': hostvars[item].vm_spread_group | string,
                 'node': hostvars[item].pve_node | default('') | string,
                 'vmid': hostvars[item].pve_vmid | default('') | string}] }}
          loop: "{{ pve_spread_candidates }}"
          when: hostvars[item].vm_spread_group | default('') | string | length > 0

        - name: Check that no spread group has two VMs on one node
          vars:
            pve_spread_bad: "{{ pve_spread_hosts | pve_spread_conflicts(pve_vms.json.data) }}"
          ansible.builtin.assert:
            that: pve_spread_bad | length == 0
            fail_msg: >-
              {% for b in pve_spread_bad %}vm_spread_group {{ b.group }} puts {{ b.hosts | join(' and ') }} on node
              {{ b.node }}{{ ' (' ~ b.live | join(', ') ~ ' running there now)' if b.live else '' }}.
              {% endfor %}The VMs of one spread group must be on different nodes: change pve_node, or migrate the VM
              in Proxmox.
            quiet: true
