---
- name: Find the ISO storage's folder on {{ pve_node }}
  ansible.builtin.include_role:
    name: os_catalog
    tasks_from: iso_dir
  vars:
    os_catalog_node: "{{ pve_ssh_host }}"

# The installer ISO, or the cloud image in the storage's Import folder (next to template/iso).
- name: Note what the VM installs from
  ansible.builtin.set_fact:
    provision_cloud: "{{ os_catalog_selected.method == 'cloud_image' }}"
    provision_media: >-
      {{ (pve_iso_dir | dirname | dirname ~ '/import/' ~ os_catalog_selected.image.file)
         if os_catalog_selected.method == 'cloud_image' else pve_iso_dir ~ '/' ~ installer_iso_name }}

- name: Check that build-installer.yml has put the installer ISO or the cloud image on {{ pve_node }}
  ansible.builtin.stat:
    path: "{{ provision_media }}"
    get_checksum: false
  register: pve_installer_iso
  delegate_to: "{{ pve_ssh_host }}"

- name: Fail if the installer ISO or the cloud image is missing
  ansible.builtin.assert:
    that: pve_installer_iso.stat.exists
    fail_msg: "{{ provision_media }} is not on {{ pve_node }}. Run playbooks/build-installer.yml first."
    quiet: true

- name: Fetch public SSH keys from GitHub
  ansible.builtin.uri:
    url: "{{ github_keys_url }}"
    return_content: true
  register: pve_github_keys
  delegate_to: localhost
  become: false
  check_mode: false
  when: github_user | length > 0

- name: Collect the authorized keys
  ansible.builtin.set_fact:
    # Each key once, by its type and key material: a key both on GitHub and in admin_extra_ssh_keys (the web
    # UI's key can be a published one) would otherwise make authorized_key report a change on every run.
    # The later entry wins, so an extra key's comment is kept.
    provision_ssh_keys: "{{ dict(provision_ssh_keys_listed | map('split') | map('batch', 2) | map('first') | map('join', ' ')
      | zip(provision_ssh_keys_listed)).values() | list }}"
  vars:
    # One key per line: the GitHub file and the extra keys are split on every line break, so no entry can
    # carry a second line into authorized_keys or the installer configuration.
    provision_ssh_keys_listed: "{{ ((pve_github_keys.content | default('')) ~ '\n' ~ (admin_extra_ssh_keys | join('\n'))).splitlines()
      | map('trim') | select('match', '^(ssh-|ecdsa-|sk-)') | list }}"

- name: Fail if there are no SSH keys
  ansible.builtin.assert:
    that: provision_ssh_keys | length > 0
    fail_msg: No public keys found for github_user '{{ github_user }}' and admin_extra_ssh_keys is empty.
    quiet: true

- name: Hash the admin password
  ansible.builtin.set_fact:
    provision_password_hash: "{{ admin_password | string | password_hash('sha512') }}"
  no_log: "{{ pve_hide_secrets }}"

# Everything from the seed ISO to its deletion runs in one block, so a failure part-way
# still removes the seed (it holds the password hash) from the node.
- name: Build the seed and run the installer
  block:
    - name: Create the seed directory
      ansible.builtin.file:
        path: "{{ installer_work_dir }}/seed-{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: "{{ pve_ssh_host }}"

    - name: Render the user-data for {{ 'cloud-init' if provision_cloud else 'autoinstall' }}
      ansible.builtin.template:
        src: "{{ 'cloud-user-data.j2' if provision_cloud else 'user-data.j2' }}"
        dest: "{{ installer_work_dir }}/seed-{{ inventory_hostname }}/user-data"
        mode: "0600"
      delegate_to: "{{ pve_ssh_host }}"
      # The disk passphrase is in it in clear text: hidden even while debugging with pve_hide_secrets false.
      no_log: "{{ pve_hide_secrets | bool or vm_disk_encryption | bool }}"

    # Autoinstall carries the network in its user-data; cloud-init reads it from a file of its own.
    - name: Render the cloud-init network-config
      ansible.builtin.template:
        src: network-config.j2
        dest: "{{ installer_work_dir }}/seed-{{ inventory_hostname }}/network-config"
        mode: "0600"
      delegate_to: "{{ pve_ssh_host }}"
      when: provision_cloud

    - name: Render meta-data
      ansible.builtin.template:
        src: meta-data.j2
        dest: "{{ installer_work_dir }}/seed-{{ inventory_hostname }}/meta-data"
        mode: "0600"
      delegate_to: "{{ pve_ssh_host }}"

    - name: Build the NoCloud seed ISO
      ansible.builtin.command:
        argv: >-
          {{ ['xorriso', '-as', 'mkisofs', '-quiet', '-output', pve_iso_dir ~ '/seed-' ~ inventory_hostname ~ '.iso',
              '-volid', 'CIDATA', '-joliet', '-rock']
             + (['user-data', 'meta-data'] + (['network-config'] if provision_cloud else []))
               | map('regex_replace', '^', installer_work_dir ~ '/seed-' ~ inventory_hostname ~ '/') | list }}
      changed_when: true
      delegate_to: "{{ pve_ssh_host }}"

    - name: Restrict the seed ISO (it holds the password hash and any disk passphrase)
      ansible.builtin.file:
        path: "{{ pve_iso_dir }}/seed-{{ inventory_hostname }}.iso"
        mode: "0600"
      delegate_to: "{{ pve_ssh_host }}"

    # pveproxy restarting a worker can drop the connection while Proxmox goes on to create the VM (seen with three
    # VMs created at once), and proxmox_kvm doesn't retry. A dropped connection is retried, and a try that finds
    # the VM created changes nothing; any other answer from Proxmox is final. A last try that drops too isn't an
    # error here: the check below finds out whether the VM exists.
    - name: Create VM {{ pve_vmid }}
      community.proxmox.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_port: "{{ pve_api_port }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        api_timeout: "{{ pve_api_timeout | int }}"
        validate_certs: "{{ pve_validate_certs }}"
        node: "{{ pve_node }}"
        vmid: "{{ pve_vmid | int }}"
        name: "{{ inventory_hostname_short }}"
        description: >-
          Installed by ubuntu-server-auto-setup ({{ (os_catalog_selected.name ~ ' ' ~ os_catalog_selected.version
          ~ ' cloud image ' ~ os_catalog_selected.image.build) if provision_cloud else 'Ubuntu ' ~ os_catalog_point_release }})
        tags: "{{ provision_tags }}"
        ostype: l26
        machine: q35
        bios: ovmf
        efidisk0:
          storage: "{{ pve_storage }}"
          format: "{{ pve_efidisk_format }}"
          efitype: 4m
          pre_enrolled_keys: "{{ vm_secure_boot | bool }}"
        # A virtual TPM 2.0 for unlocking the encrypted disk. Proxmox keeps its state in a small volume.
        tpmstate0: "{{ {'storage': pve_tpmstate_storage, 'version': '2.0'} if vm_disk_encryption | bool else omit }}"
        cpu: "{{ vm_cpu_type }}"
        sockets: "{{ vm_sockets }}"
        cores: "{{ vm_cores }}"
        memory: "{{ vm_memory_mb }}"
        scsihw: virtio-scsi-single
        # A cloud image's disk is a copy of the image (Proxmox converts it to the storage's format), grown below.
        scsi:
          scsi0: >-
            {{ pve_storage }}:{{ ('0,import-from=' ~ pve_iso_storage ~ ':import/' ~ os_catalog_selected.image.file)
            if provision_cloud else vm_disk_gb }},discard=on,iothread=1,ssd=1
        ide: >-
          {{ {'ide2': pve_iso_storage ~ ':iso/seed-' ~ inventory_hostname ~ '.iso,media=cdrom'} if provision_cloud
             else {'ide2': pve_iso_storage ~ ':iso/' ~ installer_iso_name ~ ',media=cdrom',
                   'ide3': pve_iso_storage ~ ':iso/seed-' ~ inventory_hostname ~ '.iso,media=cdrom'} }}
        net: "{{ dict(provision_nics | map(attribute='key') | zip(provision_nics | map(attribute='proxmox'))) }}"
        boot: "{{ 'order=scsi0' if provision_cloud else 'order=scsi0;ide2' }}"
        agent: enabled=1
        onboot: "{{ vm_onboot | bool }}"
        state: present
        # Copying a cloud image into the VM's disk takes longer than creating an empty one.
        timeout: "{{ 900 if provision_cloud else 300 }}"
      delegate_to: localhost
      become: false
      register: pve_vm_create
      failed_when: pve_vm_create is failed and not pve_vm_create_dropped
      until: not pve_vm_create_dropped
      retries: 3
      delay: 5
      vars:
        pve_vm_create_dropped: "{{ pve_vm_create.msg | default('') is search(pve_api_dropped_pattern) }}"
      no_log: "{{ pve_hide_secrets }}"

    # After a dropped connection the VM may exist although no try reported creating it, or (if something else made
    # one with the same ID in between) be another VM: carry on only with one that has this host's name and the
    # role's description, once Proxmox has finished creating it.
    - name: Check the VM after a dropped connection
      when: pve_vm_create.attempts | default(1) | int > 1
      block:
        - name: Read the configuration of VM {{ pve_vmid }}
          ansible.builtin.uri:
            url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ pve_vmid }}/config"
            headers: "{{ pve_api_headers }}"
            validate_certs: "{{ pve_validate_certs }}"
            timeout: "{{ pve_api_timeout | int }}"
            status_code: [200, 500]
          register: pve_vm_created
          until: >-
            pve_vm_created.status | default(-1) | int not in [-1, 500]
            and 'lock' not in (pve_vm_created.json.data | default({}, true))
          retries: 12
          delay: 5
          failed_when: pve_vm_created.status | default(-1) | int == -1
          delegate_to: localhost
          become: false
          check_mode: false
          no_log: "{{ pve_hide_secrets }}"

        - name: Fail unless it is the VM this run created
          vars:
            pve_vm_created_config: "{{ pve_vm_created.json.data | default({}, true) if pve_vm_created.status == 200 else {} }}"
          ansible.builtin.assert:
            that:
              - pve_vm_created_config.name | default('') == inventory_hostname_short
              - pve_vm_created_config.description | default('') is match('Installed by ubuntu-server-auto-setup ')
              - "'lock' not in pve_vm_created_config"
            fail_msg: >-
              The connection to Proxmox dropped while creating VM {{ pve_vmid }}, and
              {{ ("VM " ~ pve_vmid ~ " doesn't exist") if not pve_vm_created_config
              else ("VM " ~ pve_vmid ~ " is still locked (" ~ pve_vm_created_config.lock ~ ")") if 'lock' in pve_vm_created_config
              else ("VM " ~ pve_vmid ~ " isn't the one this run creates (its name is '" ~ pve_vm_created_config.name | default('')
                    ~ "', not '" ~ inventory_hostname_short ~ "')") }}.
              {{ 'The last error: ' ~ pve_vm_create.msg if pve_vm_create.msg | default('') is search(pve_api_dropped_pattern)
              and not pve_hide_secrets | bool else '' }}
            quiet: true

    # The image's own size is a few GB; Proxmox refuses to shrink it, so vm_disk_gb must be at least that.
    # cloud-init grows the root file system into the space on first boot.
    - name: Grow the disk to vm_disk_gb GB, here {{ vm_disk_gb }}
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ pve_vmid }}/resize"
        method: PUT
        headers: "{{ pve_api_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        timeout: "{{ pve_api_timeout | int }}"
        body_format: form-urlencoded
        body:
          disk: scsi0
          size: "{{ vm_disk_gb }}G"
      register: pve_vm_resize
      delegate_to: localhost
      become: false
      when: provision_cloud
      no_log: "{{ pve_hide_secrets }}"

    - name: Wait until the disk has grown
      ansible.builtin.include_tasks: wait_task.yml
      vars:
        pve_task: "{{ pve_vm_resize.json.data }}"
        pve_task_what: resize VM {{ pve_vmid }}'s disk
      # Proxmox VE 8.2 and later answer with a task; older ones resized before answering.
      when: provision_cloud and pve_vm_resize.json.data | default('', true) is string
        and pve_vm_resize.json.data | default('', true) is match('UPID:')

    - name: Start the VM, and with it the {{ 'first boot, in which cloud-init sets it up' if provision_cloud else 'installer' }}
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ pve_vmid }}/status/start"
        method: POST
        headers: "{{ pve_api_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        timeout: "{{ pve_api_timeout | int }}"
      register: pve_vm_start
      delegate_to: localhost
      become: false
      no_log: "{{ pve_hide_secrets }}"

    - name: Wait until the VM is running
      ansible.builtin.include_tasks: wait_task.yml
      vars:
        pve_task: "{{ pve_vm_start.json.data }}"
        pve_task_what: start VM {{ pve_vmid }}

    - name: Wait until the VM powers off at the end of the {{ 'first boot' if provision_cloud else 'install' }}
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ pve_vmid }}/status/current"
        headers: "{{ pve_api_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        timeout: "{{ pve_api_timeout | int }}"
      register: pve_vm_status
      until: pve_vm_status.json is defined and pve_vm_status.json.data.status == 'stopped'
      retries: "{{ (vm_install_timeout | int) // (vm_install_poll_interval | int) }}"
      delay: "{{ vm_install_poll_interval | int }}"
      delegate_to: localhost
      become: false
      no_log: "{{ pve_hide_secrets }}"

    # The extra disks (vm_extra_disks) are added only now, empty, so the installer never sees them and can't put
    # the system on one. Their serial, usas-<label>, is how the baseline finds each one.
    - name: Boot from disk only, with any extra disks, without the {{ 'seed ISO' if provision_cloud else 'installer and seed ISOs' }}
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ pve_vmid }}/config"
        method: PUT
        headers: "{{ pve_api_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        timeout: "{{ pve_api_timeout | int }}"
        body_format: form-urlencoded
        body: >-
          {{ {'delete': 'ide2' if provision_cloud else 'ide2,ide3', 'boot': 'order=scsi0'}
             | combine(data_disks_list | pve_extra_disks) }}
      delegate_to: localhost
      become: false
      no_log: "{{ pve_hide_secrets }}"

    - name: Delete the seed ISO and its files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ pve_iso_dir }}/seed-{{ inventory_hostname }}.iso"
        - "{{ installer_work_dir }}/seed-{{ inventory_hostname }}"
      delegate_to: "{{ pve_ssh_host }}"

  rescue:
    - name: Delete the seed ISO and its files after a failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ pve_iso_dir }}/seed-{{ inventory_hostname }}.iso"
        - "{{ installer_work_dir }}/seed-{{ inventory_hostname }}"
      delegate_to: "{{ pve_ssh_host }}"

    - name: Stop with the original error
      ansible.builtin.fail:
        msg: >-
          Provisioning {{ inventory_hostname }} failed at "{{ ansible_failed_task.name }}" (seed ISO removed).
          If VM {{ pve_vmid }} was created, check its console, delete it in Proxmox (qm destroy {{ pve_vmid }})
          and run again. Rerun with pve_hide_secrets=false to see the full error.

- name: Start the installed system
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ pve_vmid }}/status/start"
    method: POST
    headers: "{{ pve_api_headers }}"
    validate_certs: "{{ pve_validate_certs }}"
    timeout: "{{ pve_api_timeout | int }}"
  register: pve_vm_start
  delegate_to: localhost
  become: false
  no_log: "{{ pve_hide_secrets }}"

- name: Wait until the installed system is booting
  ansible.builtin.include_tasks: wait_task.yml
  vars:
    pve_task: "{{ pve_vm_start.json.data }}"
    pve_task_what: start VM {{ pve_vmid }}

- name: Find the address DHCP gave the new VM
  ansible.builtin.include_tasks: dhcp_address.yml
  when: net_mode == 'dhcp' and ansible_host | default('') in ['', inventory_hostname]
  vars:
    pve_dhcp_new_vm: true

- name: Wait for the installed system to answer
  block:
    - name: Wait for SSH on {{ ansible_host }}
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) | int }}"
        search_regex: OpenSSH
        timeout: 600
      delegate_to: localhost
      become: false
  rescue:
    - name: Stop with a hint about the console
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} didn't answer on SSH after the install. Check VM {{ pve_vmid }}'s console.
          {% if vm_disk_encryption | bool %}If it asks for the disk passphrase, the TPM didn't release the key (the
          Secure Boot state changed since the install): type the recovery passphrase, then see "Disk encryption" in
          docs/security.md to enroll the TPM again.{% endif %}

- name: Refresh the control node's known_hosts entry
  when: provision_manage_known_hosts | bool
  delegate_to: localhost
  become: false
  vars:
    # ssh writes "[host]:port" for any port other than 22.
    provision_known_hosts_name: >-
      {{ ansible_host if (ansible_port | default(22) | int) == 22 else '[' ~ ansible_host ~ ']:' ~ (ansible_port | int) }}
  block:
    - name: Remove the stale host key
      ansible.builtin.known_hosts:
        path: "{{ provision_known_hosts_file }}"
        name: "{{ provision_known_hosts_name }}"
        state: absent

    - name: Scan the new host key
      ansible.builtin.command:
        argv: [ssh-keyscan, -T, "10", -t, ed25519, -p, "{{ ansible_port | default(22) | string }}", "{{ ansible_host }}"]
      register: pve_host_key
      changed_when: false
      failed_when: pve_host_key.stdout | length == 0

    - name: Trust the new host key
      ansible.builtin.known_hosts:
        path: "{{ provision_known_hosts_file }}"
        name: "{{ provision_known_hosts_name }}"
        key: "{{ pve_host_key.stdout_lines | select('match', '^[^#]') | first }}"
        state: present

# The first-boot user and keys are created by cloud-init, which can lag sshd by a few seconds.
- name: Wait until the admin user can log in
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Finish the disk encryption on the running system
  ansible.builtin.include_tasks: first_boot.yml
  when: vm_disk_encryption | bool
