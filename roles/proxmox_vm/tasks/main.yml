---
- name: Check required variables
  ansible.builtin.assert:
    that:
      - pve_api_host | length > 0
      - pve_api_token_id | length > 0
      - pve_api_token_secret | length > 0
      - pve_node | length > 0
      - pve_vmid | string is match('^[0-9]+\Z')
      - ansible_host is defined and ansible_host != inventory_hostname
      - net_gateway | length > 0
      - github_user | length > 0 or admin_extra_ssh_keys | length > 0
      - admin_password | length > 0
    fail_msg: >-
      Set pve_api_host, the API token, pve_node, a numeric pve_vmid, ansible_host (the static IP),
      net_gateway, github_user (or admin_extra_ssh_keys) and admin_password for {{ inventory_hostname }}.
    quiet: true

# These values go into the installer's configuration and a shell command run as root during the install.
- name: Check the formats of values the installer uses
  ansible.builtin.assert:
    that:
      - admin_user is match(provision_username_pattern)
      - inventory_hostname_short is match(provision_hostname_pattern)
      - ansible_host is match(provision_ipv4_pattern)
      - net_gateway is match(provision_ipv4_pattern)
      - net_prefix | string is match('^[0-9]{1,2}\Z') and 1 <= (net_prefix | int) <= 32
    fail_msg: >-
      {{ inventory_hostname }}: admin_user must be a lowercase Linux user name, the inventory name a valid
      host name (letters, digits, hyphens), ansible_host and net_gateway IPv4 addresses, and net_prefix 1-32.
    quiet: true

- name: Build the API auth header
  ansible.builtin.set_fact:
    pve_api_headers:
      Authorization: "PVEAPIToken={{ pve_api_user }}!{{ pve_api_token_id }}={{ pve_api_token_secret }}"
  no_log: "{{ pve_hide_secrets }}"

- name: List VMs in the cluster
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/cluster/resources?type=vm"
    headers: "{{ pve_api_headers }}"
    validate_certs: "{{ pve_validate_certs }}"
    timeout: "{{ pve_api_timeout | int }}"
  register: pve_vms
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: "{{ pve_hide_secrets }}"

- name: Note where the VM goes
  ansible.builtin.set_fact:
    pve_placement:
      host: "{{ inventory_hostname }}"
      node: "{{ pve_node }}"
      ssh_host: "{{ pve_ssh_host }}"
      storage: "{{ pve_iso_storage }}"

# Every server of the run at once: one error lists every host whose node or ISO storage is wrong.
- name: Check the servers' nodes and ISO storages against the cluster
  ansible.builtin.import_tasks: cluster.yml
  vars:
    pve_placements: "{{ ansible_play_hosts | map('extract', hostvars, 'pve_placement') | list }}"

- name: Check whether the cluster already has VM {{ pve_vmid }}
  ansible.builtin.set_fact:
    pve_vm_exists: "{{ pve_vms.json.data | selectattr('vmid', 'equalto', pve_vmid | int) | list | length > 0 }}"

- name: Report existing VM
  vars:
    pve_vm_node: "{{ (pve_vms.json.data | selectattr('vmid', 'equalto', pve_vmid | int) | first).node | default('') }}"
  ansible.builtin.debug:
    msg: >-
      VM {{ pve_vmid }} already exists{{ (' on node ' ~ pve_vm_node) if pve_vm_node != pve_node else '' }};
      skipping install for {{ inventory_hostname }}.
  when: pve_vm_exists

# Only the nodes that get a new VM need SSH (for the seed ISO).
- name: Check SSH to the nodes that get a new VM
  ansible.builtin.import_tasks: ssh_check.yml
  vars:
    pve_ssh_check_host: "{{ '' if pve_vm_exists else pve_ssh_host }}"

- name: Install Ubuntu on a new VM
  ansible.builtin.include_tasks: provision.yml
  when: not pve_vm_exists
