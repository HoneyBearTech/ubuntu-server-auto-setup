---
# The k3s catalog: the k3s releases the k3s role installs and the kube-vip images it deploys, each pinned like a
# lock file. A binary is installed only if it matches its SHA-256 here, an image is pulled only by its digest here.
# k3s publishes its checksums (sha256sum-<arch>.txt) over HTTPS with no signature, and kube-vip its images on
# GHCR with no signature either, so these pins are taken over HTTPS and reviewed in the pull request that changes
# them. tools/update_k3s_catalog.py checks them against upstream again, and the weekly OS catalog workflow opens
# an issue when one no longer matches or upstream has a newer release.
k3s_catalog:
  - version: v1.36.5+k3s1
    binaries:
      amd64:
        url: https://github.com/k3s-io/k3s/releases/download/v1.36.5%2Bk3s1/k3s
        sha256: "d73847bcd3c5fccef0115b372e2f9a91f3032dc84bbf71518a4617565294d313"
      arm64:
        url: https://github.com/k3s-io/k3s/releases/download/v1.36.5%2Bk3s1/k3s-arm64
        sha256: "135e34cb9e8a1cfae3cb55577789e93501efe7edc080a8b2630458a85b07721e"
  - version: v1.37.1+k3s1
    binaries:
      amd64:
        url: https://github.com/k3s-io/k3s/releases/download/v1.37.1%2Bk3s1/k3s
        sha256: "92b94582eb7b34a8cf532e6006842b9ed215a6783cf56a3dd6271fd35243b2c0"
      arm64:
        url: https://github.com/k3s-io/k3s/releases/download/v1.37.1%2Bk3s1/k3s-arm64
        sha256: "a1561ca4aef8b99f5588a840d4468ac39c8c1cd92470bbcb9634823fa221741a"

