---
- name: Check the full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Restart ssh

- name: Restart the ssh service
  ansible.builtin.systemd_service:
    name: "{{ ssh_os_service }}"
    state: restarted
    daemon_reload: true
  listen: Restart ssh
