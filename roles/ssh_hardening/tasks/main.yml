---
- name: Check the SSH settings
  ansible.builtin.assert:
    that:
      - ssh_port | string is match('^[0-9]{1,5}\Z') and 1 <= (ssh_port | int) <= 65535
      - ssh_allow_users | select('match', ssh_allow_users_pattern) | list | length == ssh_allow_users | length
      - ssh_permit_root_login in ssh_permit_root_login_values
    fail_msg: >-
      ssh_port must be 1-65535, ssh_allow_users entries can't contain spaces or line breaks, and
      ssh_permit_root_login must be one of {{ ssh_permit_root_login_values | join(', ') }}.
    quiet: true

- name: Check that the admin user may still log in
  ansible.builtin.assert:
    that: ssh_allow_users | length == 0 or (admin_user | default(ansible_user)) in ssh_allow_users
    fail_msg: ssh_allow_users doesn't include {{ admin_user | default(ansible_user) }}; applying it would lock Ansible out.
    quiet: true

# sshd's unit, and whether it can be socket-activated: ssh with ssh.socket on Ubuntu and Debian, sshd on the RHEL
# family (vars/<os_family>.yml).
- name: Load the settings for the server's OS family
  ansible.builtin.include_vars:
    file: "{{ ansible_facts.os_family }}.yml"

- name: Read the current hardening drop-in
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config.d/00-hardening.conf
  register: ssh_current_dropin
  failed_when: false

- name: Note the port sshd uses now
  ansible.builtin.set_fact:
    ssh_previous_port: >-
      {{ (ssh_current_dropin.content | default('') | b64decode)
         | regex_findall('^Port\s+([0-9]+)', multiline=True) | default(['22'], true) | first | int }}

# sshd uses the first value it reads for most options, and drop-ins load in name order,
# so 00- wins over 50-cloud-init.conf and the main sshd_config.
- name: Install the hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# SELinux (enforcing on the RHEL family) lets sshd listen only on ports labelled ssh_port_t. The label goes on before
# sshd moves, and SELinux stays enforcing.
- name: Install SELinux's port tools
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  register: ssh_selinux_tools
  when: ssh_port | int != 22 and ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Let sshd use the new port under SELinux
  community.general.seport:
    ports: "{{ ssh_port | string }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ssh_port | int != 22 and ansible_facts.selinux.status | default('disabled') == 'enabled'
    - not (ansible_check_mode and ssh_selinux_tools is changed)

# Ubuntu starts sshd from ssh.socket, which listens on port 22 regardless of sshd_config.
# For any other port, run ssh.service directly so sshd's own Port setting applies.
- name: Switch from socket activation to ssh.service for a custom port
  when: ssh_port | int != 22 and ssh_os_socket | length > 0
  block:
    - name: Enable ssh.service
      ansible.builtin.systemd_service:
        name: ssh.service
        enabled: true

    - name: Disable ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        enabled: false
        state: stopped
      notify: Restart ssh

- name: Apply SSH changes now
  ansible.builtin.meta: flush_handlers

# Not in check mode: sshd hasn't really moved, so the run carries on over the current port.
- name: Reconnect on the new SSH port
  when: ssh_previous_port | int != ssh_port | int and not ansible_check_mode
  block:
    # Trust the host key read over the already-verified connection, not a fresh scan.
    - name: Read the server's host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: ssh_host_key

    # One server at a time: each write reads the whole file and replaces it, so two at once lose one's entry.
    - name: Add a known_hosts entry for the new port
      ansible.builtin.known_hosts:
        path: "{{ ssh_known_hosts_file }}"
        name: "[{{ ansible_host }}]:{{ ssh_port }}"
        key: "[{{ ansible_host }}]:{{ ssh_port }} {{ (ssh_host_key.content | b64decode).split()[:2] | join(' ') }}"
        state: present
      delegate_to: localhost
      become: false
      throttle: 1

    - name: Switch the connection to port {{ ssh_port }}
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port | int }}"

    - name: Wait for SSH on port {{ ssh_port }}
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Remove the old port 22 firewall rule
      ansible.builtin.include_role:
        name: firewall
        tasks_from: close_port/{{ ansible_facts.os_family }}
        apply:
          tags: [always]
      vars:
        firewall_close_port: 22
