---
# Finds the folder of the ISO storage (pve_iso_storage) on the Proxmox node, unless pve_iso_dir is set:
# local is /var/lib/vz/template/iso, an NFS or CIFS storage /mnt/pve/<id>/template/iso, and so on.
# Run on the node itself (installer_iso), or from a server's play with ubuntu_release_node set to the
# inventory host that reaches the node (proxmox_vm).
- name: Check the ISO storage name
  ansible.builtin.assert:
    that: pve_iso_storage is match(pve_storage_id_pattern)
    fail_msg: "pve_iso_storage must be a Proxmox storage ID (letters, digits, dots, underscores, hyphens)."
    quiet: true

- name: Find the ISO storage's folder
  when: pve_iso_dir | default('') | length == 0
  delegate_to: "{{ ubuntu_release_node | default(inventory_hostname) }}"
  block:
    - name: List the storages that allow ISO images
      ansible.builtin.command:
        argv: [pvesm, status, --content, iso]
      register: ubuntu_release_iso_storages
      changed_when: false
      check_mode: false

    - name: Fail if the ISO storage doesn't exist or doesn't allow ISO images
      vars:
        # The header row, then one row per storage: name, type, status, ...
        ubuntu_release_rows: "{{ ubuntu_release_iso_storages.stdout_lines[1:] | map('split') | list }}"
        ubuntu_release_active: "{{ ubuntu_release_rows | selectattr('2', 'defined') | selectattr('2', 'equalto', 'active')
                                   | map('first') | list }}"
      ansible.builtin.assert:
        that: pve_iso_storage in ubuntu_release_active
        fail_msg: >-
          Storage '{{ pve_iso_storage }}' doesn't exist on {{ ubuntu_release_node | default(inventory_hostname) }},
          isn't active, or doesn't allow ISO images (Datacenter → Storage → {{ pve_iso_storage }} → Content:
          ISO image). Storages that do: {{ ubuntu_release_active | join(', ') or 'none' }}.
        quiet: true

    - name: Ask Proxmox where the storage keeps ISO images
      ansible.builtin.command:
        argv: [pvesm, path, "{{ pve_iso_storage }}:iso/{{ ubuntu_iso_name }}"]
      register: ubuntu_release_iso_path
      changed_when: false
      check_mode: false

- name: Use that folder
  ansible.builtin.set_fact:
    pve_iso_dir: "{{ ubuntu_release_iso_path.stdout | trim | dirname }}"
  when: ubuntu_release_iso_path is defined and ubuntu_release_iso_path is not skipped
