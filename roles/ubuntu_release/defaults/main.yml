---
# Shared by installer_iso and proxmox_vm (both depend on this role).
# Ubuntu moves superseded point releases to old-releases.ubuntu.com; bump
# ubuntu_point_release when a new one ships (or point ubuntu_iso_base_url there).
ubuntu_release: "26.04"
ubuntu_point_release: "26.04.1"
ubuntu_iso_base_url: "https://releases.ubuntu.com/{{ ubuntu_release }}"
ubuntu_iso_name: "ubuntu-{{ ubuntu_point_release }}-live-server-amd64.iso"
installer_iso_name: "{{ ubuntu_iso_name | regex_replace('\\.iso$', '-autoinstall.iso') }}"

# The Proxmox storage for the ISOs (it must allow ISO images; a storage shared by the cluster, such as NFS,
# works for every node). Its folder on the node is asked from Proxmox (`pvesm path`); set pve_iso_dir only
# to override that, for an unusual setup.
pve_iso_storage: local
pve_iso_dir: ""
installer_work_dir: /var/tmp/ubuntu-server-auto-setup

# The user Ansible logs in to the Proxmox nodes as over SSH; the proxmox_nodes' ansible_user must match (the roles
# check). root needs nothing else. Any other user needs playbooks/prepare-node.yml run once (it logs in as root)
# first: it creates the user, with write access to the ISO storages' folders only (docs/installing.md).
pve_ssh_user: root
