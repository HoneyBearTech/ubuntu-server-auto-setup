---
# Copy to inventory/hosts.yml (gitignored) and edit. Secrets go in
# inventory/group_vars/all/vault.yml, encrypted with ansible-vault (see inventory/vault.example.yml).
all:
  vars:
    # Whose public keys (https://github.com/<user>.keys) get installed for the admin user.
    github_user: HoneyBearTech
    admin_user: sysadmin
    admin_password: "{{ vault_admin_password }}"
    timezone: America/Chicago

    # Proxmox VE API (token needs the privileges listed in docs/installing.md)
    pve_api_host: pve-1.example.lan
    pve_api_user: ansible@pve
    pve_api_token_id: "{{ vault_pve_api_token_id }}"
    pve_api_token_secret: "{{ vault_pve_api_token_secret }}"
    pve_validate_certs: true

  children:
    # Proxmox nodes: Ansible connects to them as root over SSH to build the ISOs.
    # Each inventory hostname must match the Proxmox node name.
    proxmox_nodes:
      hosts:
        pve-1:
          ansible_host: 10.10.10.10
          ansible_user: root

    ubuntu_servers:
      vars:
        ansible_user: "{{ admin_user }}"
        # Sudo needs the admin password once the first baseline run has removed passwordless sudo.
        ansible_become_password: "{{ vault_admin_password }}"
        pve_node: pve-1
        pve_storage: local-lvm
        pve_bridge: vmbr0
        net_prefix: 24
        net_gateway: 10.10.10.1
        net_dns: [10.10.10.1, 1.1.1.1]
        net_search: [example.lan]
        fail2ban_ignoreip: [10.10.10.0/24]
      hosts:
        web-01:
          ansible_host: 10.10.10.61   # static IP the installer configures
          pve_vmid: 4061
          vm_cores: 2
          vm_memory_mb: 4096
          vm_disk_gb: 32
          ufw_allow:
            - { port: "80", proto: tcp, comment: http }
            - { port: "443", proto: tcp, comment: https }
        db-01:
          ansible_host: 10.10.10.62
          pve_vmid: 4062
          vm_cores: 4
          vm_memory_mb: 8192
          vm_disk_gb: 64
          ufw_allow:
            - { port: "5432", proto: tcp, from: 10.10.10.0/24, comment: postgres }
        # Address from DHCP: read from the VM's guest agent after the install (the token needs
        # VM.GuestAgent.Audit on Proxmox VE 9). A fixed MAC address lets you reserve the address on the
        # DHCP server; then you can also set ansible_host to it, and the agent isn't asked.
        # app-01:
        #   pve_vmid: 4063
        #   net_mode: dhcp
        #   net_mac: "BC:24:11:40:63:01"
        # A VLAN on the first card, and two more cards: storage on VLAN 20 (static, jumbo frames) and
        # VLAN 30 (DHCP). Only one card has the default route (here net_gateway, on the first card).
        # nas-gw-01:
        #   ansible_host: 10.10.10.64
        #   pve_vmid: 4064
        #   pve_vlan: 10
        #   vm_extra_nics:
        #     - { bridge: vmbr1, vlan: 20, mode: static, address: 10.20.0.64, prefix: 24, mtu: 9000 }
        #     - { bridge: vmbr1, vlan: 30, mode: dhcp }
