---
# Copy to inventory/hosts.yml (gitignored) and edit. Secrets go in
# inventory/group_vars/all/vault.yml, encrypted with ansible-vault (see inventory/vault.example.yml).
all:
  vars:
    # Whose public keys (https://github.com/<user>.keys) get installed for the admin user.
    github_user: HoneyBearTech
    admin_user: sysadmin
    admin_password: "{{ vault_admin_password }}"
    timezone: America/Chicago

    # Proxmox VE API (token needs the privileges listed in docs/installing.md). Any node of the cluster
    # answers for all of them; one inventory uses the nodes of one cluster.
    pve_api_host: pve-1.example.lan
    pve_api_user: ansible@pve
    pve_api_token_id: "{{ vault_pve_api_token_id }}"
    pve_api_token_secret: "{{ vault_pve_api_token_secret }}"
    pve_validate_certs: true
    # The user Ansible logs in to the Proxmox nodes as, over SSH, to build the ISOs. root works as it is; for
    # a user without root's privileges (for example usas-build), run playbooks/prepare-node.yml once first
    # (see docs/installing.md).
    pve_ssh_user: root

  children:
    # Proxmox nodes, reached over SSH as pve_ssh_user to build the ISOs and the seed files. Each inventory
    # hostname must match the Proxmox node name. List every node a server uses, and pin each one's SSH host key
    # (docs/host-keys.md).
    proxmox_nodes:
      vars:
        ansible_user: "{{ pve_ssh_user }}"
      hosts:
        pve-1:
          ansible_host: 10.10.10.10
        pve-2:
          ansible_host: 10.10.10.11

    # The servers: new VMs to install, and servers you already have for the baseline. (Before 0.7.0 this group
    # was ubuntu_servers, which the playbooks still read until 1.0.)
    servers:
      vars:
        ansible_user: "{{ admin_user }}"
        # Sudo needs the admin password once the first baseline run has removed passwordless sudo.
        ansible_become_password: "{{ vault_admin_password }}"
        pve_node: pve-1        # the default; a server can set its own (see db-01)
        vm_os: ubuntu-26.04    # the default: an id from the OS catalog (docs/interfaces.md); per server too
        pve_storage: local-lvm
        pve_bridge: vmbr0
        net_prefix: 24
        net_gateway: 10.10.10.1
        net_dns: [10.10.10.1, 1.1.1.1]
        net_search: [example.lan]
        fail2ban_ignoreip: [10.10.10.0/24]
      hosts:
        web-01:
          ansible_host: 10.10.10.61   # static IP the installer configures
          pve_vmid: 4061
          vm_cores: 2
          vm_memory_mb: 4096
          vm_disk_gb: 32
          firewall_allow:
            - { port: "80", proto: tcp, comment: http }
            - { port: "443", proto: tcp, comment: https }
        db-01:
          ansible_host: 10.10.10.62
          pve_vmid: 4062
          pve_node: pve-2      # created on the cluster's other node
          vm_os: ubuntu-24.04  # installs Ubuntu 24.04 LTS
          vm_cores: 4
          vm_memory_mb: 8192
          vm_disk_gb: 64
          # Encrypt this VM's disk, unlocked at boot by a vTPM (see docs/security.md, "Secure Boot and disk
          # encryption"); the Vault passphrase stays the recovery key.
          # vm_disk_encryption: true
          # vm_disk_passphrase: "{{ vault_disk_passphrase }}"
          firewall_allow:
            - { port: "5432", proto: tcp, from: 10.10.10.0/24, comment: postgres }
        # Address from DHCP: read from the VM's guest agent after the install (the token needs
        # VM.GuestAgent.Audit on Proxmox VE 9). A fixed MAC address lets you reserve the address on the
        # DHCP server; then you can also set ansible_host to it, and the agent isn't asked.
        # app-01:
        #   pve_vmid: 4063
        #   net_mode: dhcp
        #   net_mac: "BC:24:11:40:63:01"
        # A VLAN on the first card, and two more cards: storage on VLAN 20 (static, jumbo frames) and
        # VLAN 30 (DHCP). Only one card has the default route (here net_gateway, on the first card).
        # nas-gw-01:
        #   ansible_host: 10.10.10.64
        #   pve_vmid: 4064
        #   pve_vlan: 10
        #   vm_extra_nics:
        #     - { bridge: vmbr1, vlan: 20, mode: static, address: 10.20.0.64, prefix: 24, mtu: 9000 }
        #     - { bridge: vmbr1, vlan: 30, mode: dhcp }
        # A second disk, formatted and mounted by the baseline; and three servers kept on different nodes.
        # db-01:
        #   ansible_host: 10.10.10.65
        #   pve_vmid: 4065
        #   vm_extra_disks:
        #     - { size_gb: 100, label: pgdata, mount: /var/lib/postgresql }
        # cp-1: { ansible_host: 10.10.10.71, pve_vmid: 4071, pve_node: pve-a, vm_spread_group: k8s-lab-servers }
        # cp-2: { ansible_host: 10.10.10.72, pve_vmid: 4072, pve_node: pve-b, vm_spread_group: k8s-lab-servers }
        # cp-3: { ansible_host: 10.10.10.73, pve_vmid: 4073, pve_node: pve-c, vm_spread_group: k8s-lab-servers }
      # A Kubernetes cluster "lab": the baseline gives its members k3s' firewall rules from each other member, its
      # kernel settings and swap off, and Longhorn's prerequisites to the agents (docs/interfaces.md#kubernetes-nodes).
      # Move cp-1 to cp-3 from hosts above into k8s_lab_servers.
      # children:
      #   k8s_lab_servers:
      #     hosts: {cp-1: {}, cp-2: {}, cp-3: {}}
      #     vars: {k8s_api_sources: [10.10.10.5]}   # the control node, for kubectl
      #   k8s_lab_agents:
      #     hosts:
      #       w-1:
      #         ansible_host: 10.10.10.81
      #         pve_vmid: 4081
      #         vm_extra_disks: [{size_gb: 100, label: longhorn, mount: /var/lib/longhorn}]
      #     vars: {k8s_longhorn_prereqs: true}

    # Servers this project didn't install, for the updates playbook only (make updates-check, make updates);
    # the other playbooks never touch them. Each needs its own login and sudo: passwordless sudo, or its own
    # password in the Vault. Never the admin password above: root on such a server could read it
    # (docs/updates.md).
    other_servers:
      hosts: {}
      # vars:
      #   ansible_user: ops
      #   ansible_become_password: "{{ vault_become_password_other_servers }}"
      #   updates_reboot: if_required
      #   updates_window: {days: [sun], start: "02:00", duration: "3h", timezone: "Europe/Berlin"}
      # hosts:
      #   legacy-web:
      #     ansible_host: 10.10.10.90
