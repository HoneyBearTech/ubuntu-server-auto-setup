{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block title %}Account{% endblock %}
{% block content %}
<h1>Change the password</h1>
{% if error %}<p class="error-summary" role="alert" id="error-summary" tabindex="-1">{{ error }}</p>{% endif %}
<form method="post" action="/account" class="narrow">
  {{ csrf_field(csrf) }}
  <div class="field">
    <label for="current">Current password</label>
    <input type="password" id="current" name="current" autocomplete="current-password" required>
  </div>
  <div class="field">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="12" required aria-describedby="password-help">
    <p class="help" id="password-help">At least 12 characters. Changing it signs out every other session.</p>
  </div>
  <div class="field">
    <label for="confirm">New password again</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="12" required>
  </div>
  <button type="submit">Change the password</button>
</form>
{% endblock %}
