---
# Inventory for tests/run.sh. Everything runs on this machine: the two "Proxmox nodes" and the "server" are
# containers with SSH on local ports, and the Proxmox API is tests/mock_pve.py. TEST_TMP is set by run.sh.
all:
  vars:
    test_tmp: "{{ lookup('ansible.builtin.env', 'TEST_TMP') }}"
    ansible_ssh_private_key_file: "{{ test_tmp }}/id_ed25519"
    # Host keys are checked against the test's own known_hosts, which the roles under test fill in.
    ansible_ssh_common_args: "-o UserKnownHostsFile={{ test_tmp }}/known_hosts -o StrictHostKeyChecking=yes"
    provision_known_hosts_file: "{{ test_tmp }}/known_hosts"
    ssh_known_hosts_file: "{{ test_tmp }}/known_hosts"

    github_user: test
    github_keys_url: http://127.0.0.1:8081/test.keys
    # A key besides the published ones, as the web UI adds its own (no private key exists for it).
    admin_extra_ssh_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOHnKFc70vANjqokVD6/f8ouShQV+FSVcKAwoG618Q2z extra@ubuntu-server-auto-setup
    admin_user: sysadmin
    admin_password: test-password
    timezone: America/Chicago

    pve_api_host: 127.0.0.1
    pve_api_user: ansible@pve
    pve_api_token_id: test
    pve_api_token_secret: 00000000-0000-4000-8000-000000000000
    pve_validate_certs: false
    ubuntu_iso_base_url: http://127.0.0.1:8080
    # root, unless a step passes -e pve_ssh_user=usas-build (after prepare-node.yml).
    pve_ssh_user: root

  children:
    proxmox_nodes:
      vars:
        ansible_user: "{{ pve_ssh_user }}"
      hosts:
        pve-test:
          ansible_host: 127.0.0.1
          ansible_port: 2211
        # The cluster's second node: its own container, sharing only the NFS storage's folder with the first.
        pve-test-2:
          ansible_host: 127.0.0.1
          ansible_port: 2212

    ubuntu_servers:
      vars:
        ansible_user: sysadmin
        ansible_become_password: test-password
        pve_node: pve-test
        net_gateway: 10.10.10.1
        net_dns: [10.10.10.1]
        vm_install_poll_interval: 2
        vm_install_timeout: 60
        fail2ban_ignoreip: [10.10.10.0/24]
        ufw_allow:
          - { port: "443", proto: tcp, comment: https }
      hosts:
        srv-01:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4061
        # Installed from an ISO storage other than local (the node's fake pvesm calls it an NFS share).
        srv-nfs:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4062
        # On the second node: its seed ISO and its installer ISO are that node's.
        srv-two:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4081
          pve_node: pve-test-2
        # Gets its address from DHCP, which the mock's guest agent reports (DHCP_LEASES in tests/mock_pve.py).
        srv-dhcp:
          ansible_port: 2201
          pve_vmid: 4063
          net_mode: dhcp
          net_mac: "02:00:00:00:40:63"
        # A VLAN on net0, a second card on another VLAN with a static address, a third with DHCP.
        srv-vlan:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4064
          pve_vlan: 10
          vm_extra_nics:
            - { bridge: vmbr1, vlan: 20, mode: static, address: 10.20.0.64, prefix: 24, mtu: 9000 }
            - { bridge: vmbr2, mode: dhcp, model: e1000 }
        # No DHCP server answers on net0: provisioning stops with a clear message.
        srv-nolease:
          pve_vmid: 4065
          net_mode: dhcp
          net_dhcp_timeout: 6
        # The token may not ask the guest agent (no VM.GuestAgent.Audit).
        srv-forbidden:
          pve_vmid: 4066
          net_mode: dhcp
        # Installed while Ansible logs in to the node as usas-build rather than root.
        srv-user:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4067
        # The mock never powers this VM off: tests the failure path of provisioning.
        srv-hang:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4099
          vm_install_timeout: 6
