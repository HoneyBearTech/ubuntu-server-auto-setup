---
# Inventory for tests/run.sh. Everything runs on this machine: the "Proxmox node" and the "server" are
# containers with SSH on local ports, and the Proxmox API is tests/mock_pve.py. TEST_TMP is set by run.sh.
all:
  vars:
    test_tmp: "{{ lookup('ansible.builtin.env', 'TEST_TMP') }}"
    ansible_ssh_private_key_file: "{{ test_tmp }}/id_ed25519"
    # Host keys are checked against the test's own known_hosts, which the roles under test fill in.
    ansible_ssh_common_args: "-o UserKnownHostsFile={{ test_tmp }}/known_hosts -o StrictHostKeyChecking=yes"
    provision_known_hosts_file: "{{ test_tmp }}/known_hosts"
    ssh_known_hosts_file: "{{ test_tmp }}/known_hosts"

    github_user: test
    github_keys_url: http://127.0.0.1:8081/test.keys
    # A key besides the published ones, as the web UI adds its own (no private key exists for it).
    admin_extra_ssh_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOHnKFc70vANjqokVD6/f8ouShQV+FSVcKAwoG618Q2z extra@ubuntu-server-auto-setup
    admin_user: sysadmin
    admin_password: test-password
    timezone: America/Chicago

    pve_api_host: 127.0.0.1
    pve_api_user: ansible@pve
    pve_api_token_id: test
    pve_api_token_secret: 00000000-0000-4000-8000-000000000000
    pve_validate_certs: false
    ubuntu_iso_base_url: http://127.0.0.1:8080

  children:
    proxmox_nodes:
      hosts:
        pve-test:
          ansible_host: 127.0.0.1
          ansible_port: 2211
          ansible_user: root

    ubuntu_servers:
      vars:
        ansible_user: sysadmin
        ansible_become_password: test-password
        pve_node: pve-test
        net_gateway: 10.10.10.1
        net_dns: [10.10.10.1]
        vm_install_poll_interval: 2
        vm_install_timeout: 60
        fail2ban_ignoreip: [10.10.10.0/24]
        ufw_allow:
          - { port: "443", proto: tcp, comment: https }
      hosts:
        srv-01:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4061
        # Installed from an ISO storage other than local (the node's fake pvesm calls it an NFS share).
        srv-nfs:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4062
        # Disk encryption: a vTPM, LUKS2 in the installer's storage layout and a TPM2 key slot after the install.
        srv-luks:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4063
          vm_disk_encryption: true
          vm_disk_passphrase: test-disk-passphrase-4063
          pve_tpmstate_storage: local-zfs
        # The mock never powers this VM off: tests the failure path of provisioning.
        srv-hang:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          pve_vmid: 4099
          vm_install_timeout: 6
