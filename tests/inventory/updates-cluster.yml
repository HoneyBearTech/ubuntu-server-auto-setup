---
# Added to tests/inventory/updates.yml by tests/updates.sh's cluster step: the API of tests/mock_pve.py
# (--fixture-updates, on port 2348), and where two VMs the inventory doesn't list are reached. On a real cluster
# the usas_pve plugin takes such a VM's address from its guest agent; here the agents report addresses of a
# network that doesn't exist, so these entries point vm-4093 and vm-4094 at the test containers. pve_api_user is
# left out, as the web UI leaves it out while it's the default: the plugin and the snapshots must use ansible@pve.
all:
  vars:
    pve_api_host: 127.0.0.1
    pve_api_port: 2348
    pve_api_token_id: test
    pve_api_token_secret: 00000000-0000-4000-8000-000000000000
    pve_validate_certs: false
  hosts:
    vm-4093:
      ansible_host: 127.0.0.1
      ansible_port: 2342
    vm-4094:
      ansible_host: 127.0.0.1
      ansible_port: 2341
  children:
    usas_pve_vms:
      vars:
        ansible_user: ops
