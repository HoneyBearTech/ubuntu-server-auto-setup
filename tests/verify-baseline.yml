---
# Checks the server state the baseline promises. Variables: expect_port (default 22) and
# expect_nopasswd (default false: the baseline removes passwordless sudo).
- name: Verify the server baseline
  hosts: srv-01
  become: true
  gather_facts: false
  vars:
    want_port: "{{ expect_port | default(22) | int }}"
  tasks:
    - name: Read the effective sshd settings
      ansible.builtin.command: sshd -T
      register: verify_sshd
      changed_when: false

    - name: Check SSH hardening
      ansible.builtin.assert:
        that:
          - verify_sshd.stdout is search('(?m)^port ' ~ want_port ~ '$')
          - verify_sshd.stdout is search('(?m)^permitrootlogin no$')
          - verify_sshd.stdout is search('(?m)^passwordauthentication no$')
          - verify_sshd.stdout is search('(?m)^kbdinteractiveauthentication no$')
          - verify_sshd.stdout is search('(?m)^authenticationmethods publickey$')
          - verify_sshd.stdout is search('(?m)^maxauthtries 4$')
          - verify_sshd.stdout is search('(?m)^x11forwarding no$')

    - name: Read the firewall status
      ansible.builtin.command: ufw status verbose
      register: verify_ufw
      changed_when: false

    - name: Check the firewall
      ansible.builtin.assert:
        that:
          - verify_ufw.stdout is search('Status:\sactive')
          - verify_ufw.stdout is search('Default:\sdeny \(incoming\), allow \(outgoing\)')
          - verify_ufw.stdout is search('(?m)^' ~ want_port ~ '/tcp\s+LIMIT IN\s+Anywhere')
          - verify_ufw.stdout is search('(?m)^443/tcp\s+ALLOW IN\s+Anywhere')
          - want_port | int == 22 or verify_ufw.stdout is not search('(?m)^22/tcp')

    - name: Read the sshd jail
      ansible.builtin.command: fail2ban-client get sshd {{ item }}
      loop: [bantime, maxretry, ignoreip]
      register: verify_jail
      changed_when: false

    - name: Check Fail2Ban
      ansible.builtin.assert:
        that:
          - verify_jail.results[0].stdout | trim == '3600'
          - verify_jail.results[1].stdout | trim == '5'
          - verify_jail.results[2].stdout is search('10.10.10.0/24')

    - name: Check the jail watches the right port
      ansible.builtin.command: grep -Fx "port = {{ want_port }}" /etc/fail2ban/jail.local
      changed_when: false

    - name: Read passwordless sudo, timezone and updates settings
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/sudoers.d/90-ansible-sysadmin
        - /etc/apt/apt.conf.d/52unattended-upgrades-local
        - /etc/apt/apt.conf.d/20auto-upgrades
        - /var/log/installer/autoinstall-user-data
      register: verify_files

    - name: Check files
      ansible.builtin.assert:
        that:
          - verify_files.results[0].stat.exists == (expect_nopasswd | default(false) | bool)
          - verify_files.results[1].stat.exists
          - verify_files.results[2].stat.exists
          - not verify_files.results[3].stat.exists

    - name: Read the timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: verify_tz
      changed_when: false

    - name: Check the timezone
      ansible.builtin.assert:
        that: verify_tz.stdout | trim == 'America/Chicago'

    - name: Read authorized_keys
      ansible.builtin.slurp:
        src: /home/sysadmin/.ssh/authorized_keys
      register: verify_keys

    - name: Check only the published key and the extra key are authorized
      ansible.builtin.assert:
        that:
          - (verify_keys.content | b64decode).splitlines() | length == 2
          - (verify_keys.content | b64decode) is search('test@ubuntu-server-auto-setup')
          - (verify_keys.content | b64decode) is search('extra@ubuntu-server-auto-setup')

- name: Verify logins the baseline must refuse
  hosts: localhost
  gather_facts: false
  vars:
    want_port: "{{ expect_port | default(22) | int }}"
    tmp: "{{ lookup('ansible.builtin.env', 'TEST_TMP') }}"
    login_port: "{{ 2201 if want_port | int == 22 else want_port }}"
  tasks:
    - name: Try a password login
      ansible.builtin.command:
        argv: [ssh, -p, "{{ login_port }}", -o, "UserKnownHostsFile={{ tmp }}/known_hosts", -o, BatchMode=yes,
               -o, PubkeyAuthentication=no, -o, PreferredAuthentications=password, sysadmin@127.0.0.1, "true"]
      register: verify_pw
      changed_when: false
      failed_when: verify_pw.rc == 0 or 'Permission denied (publickey)' not in verify_pw.stderr

    - name: Try a root login with the admin's key
      ansible.builtin.command:
        argv: [ssh, -p, "{{ login_port }}", -o, "UserKnownHostsFile={{ tmp }}/known_hosts", -o, BatchMode=yes,
               -i, "{{ tmp }}/id_ed25519", root@127.0.0.1, "true"]
      register: verify_root
      changed_when: false
      failed_when: verify_root.rc == 0 or 'Permission denied' not in verify_root.stderr
