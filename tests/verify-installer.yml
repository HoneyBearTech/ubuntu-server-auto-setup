---
- name: Verify the remastered installer ISOs
  hosts: proxmox_nodes
  gather_facts: false
  vars:
    # The remastered ISOs each node must have: tests/run.sh's servers on pve-test install 26.04, srv-two on
    # pve-test-2 installs 24.04. tests/real-iso.sh passes the real catalog's ISO for pve-test.
    verify_installer_isos:
      pve-test: [ubuntu-26.04.1-live-server-amd64-autoinstall.iso]
      pve-test-2: [ubuntu-24.04.5-live-server-amd64-autoinstall.iso]
  tasks:
    - name: Check each remastered ISO
      ansible.builtin.include_tasks: verify-installer-iso.yml
      loop: "{{ verify_installer_isos[inventory_hostname] | default([]) }}"
      loop_control:
        loop_var: verify_installer_iso
